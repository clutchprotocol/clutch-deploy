# Create a mint intent on stage. Half of the four-eyes flow — this one MINTS NOTHING.
#
# A mint intent created here sits at `created` until a DIFFERENT person runs "Approve mint intent".
# The treasury derives `created_by` and `approved_by` from the authenticated role and a DB CHECK
# refuses a row where they are equal, so the role separation is enforced in the database.
#
# What is NOT enforced: that two different people ran the two workflows. Both tokens live in the
# same host `.env`, so anyone who can dispatch this can dispatch the approval too. The Actions log
# is the audit trail for who actually did what — the database only records the role strings.
#
# This is for manual corrections (an overpaid deposit owed more CLT, a credit that has to be made
# good). Ordinary deposits do not come through here: the orchestrator creates those intents and the
# verifier approves them on independent on-chain evidence.

name: Create mint intent (stage)

on:
  workflow_dispatch:
    inputs:
      beneficiary:
        description: "Address to credit"
        required: true
      amount_clt:
        description: "Amount in micro-dollars (1 USD = 1000000, so $990 = 990000000)"
        required: true
      reason:
        description: "Why money is being created. Recorded in this log and nowhere else."
        required: true
      override_duplicate:
        description: 'Ignore the duplicate guard (only when the chain proves an existing "credited" intent was never delivered)'
        required: false
        default: "false"
      override_reason:
        description: "Justification for the override. Required when overriding."
        required: false
        default: ""
      confirm:
        description: 'Type "create" to confirm'
        required: true
        default: ""

concurrency:
  group: mint-intent
  cancel-in-progress: false

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - name: Check the confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "create" ]; then
            echo "Refusing: confirm was '${{ inputs.confirm }}', expected 'create'."
            exit 1
          fi

      # Through env, never interpolated into the script body. A reason containing backticks or
      # $(...) would otherwise execute as shell in a workflow whose other half creates money.
      - name: Record who asked
        env:
          ACTOR: ${{ github.actor }}
          REASON: ${{ inputs.reason }}
        run: |
          echo "dispatched by $ACTOR"
          echo "reason: $REASON"

      - name: Create via SSH
        env:
          SSHPASS: ${{ secrets.STAGE_SSH_PASSWORD }}
          CLUTCH_SSH_HOST: ${{ secrets.STAGE_HOST }}
          CLUTCH_SSH_USER: ${{ secrets.STAGE_USER }}
          BENEFICIARY: ${{ inputs.beneficiary }}
          AMOUNT_CLT: ${{ inputs.amount_clt }}
          REASON: ${{ inputs.reason }}
          OVERRIDE_DUPLICATE: ${{ inputs.override_duplicate }}
          OVERRIDE_REASON: ${{ inputs.override_reason }}
        run: |
          # Plain ssh, not appleboy/ssh-action. That action downloads a drone-ssh binary from
          # GitHub releases on EVERY run -- unconditionally, there is no skip-if-present -- and on
          # 2026-09-14 that CDN answered 504 to all six attempts of the action's own `curl --retry 5`
          # and failed a deploy. Its retry is the thing we watched lose, so retrying harder is not
          # the fix; not depending on a runtime download is. `ssh` is already on the runner.
          #
          # The script travels as a FILE, never as an argument. The 11 KB inline block this repo
          # used to carry failed three times in ways that contradicted its own source, because what
          # bash received was not what the workflow contained. One quoting layer is better than two.
          set -euo pipefail
          command -v sshpass >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq sshpass; }
          R="/tmp/clutch-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -o ServerAliveInterval=30"
          # Values reach the host as a file of shell-quoted assignments and are sourced there --
          # never interpolated into the command line. That is the property the action's `envs:`
          # input gave us, kept deliberately: a workflow input must not be able to become part of
          # the command that runs. The file is deleted on the host the moment it has been read.
          : > "$RUNNER_TEMP/clutch-env.sh"
          for v in BENEFICIARY AMOUNT_CLT REASON OVERRIDE_DUPLICATE OVERRIDE_REASON; do printf '%s=%q\n' "$v" "${!v-}" >> "$RUNNER_TEMP/clutch-env.sh"; done
          sshpass -e ssh $SSH_OPTS "$CLUTCH_SSH_USER@$CLUTCH_SSH_HOST" "cat > $R.env" < "$RUNNER_TEMP/clutch-env.sh"
          cat > "$RUNNER_TEMP/clutch-remote.sh" <<'CLUTCH_REMOTE_EOF'
          set -euo pipefail
          cd "${{ secrets.STAGE_DEPLOY_PATH }}"
          git pull --ff-only origin main
          ACTION=create bash scripts/mint-intent.sh
          CLUTCH_REMOTE_EOF
          sshpass -e ssh $SSH_OPTS "$CLUTCH_SSH_USER@$CLUTCH_SSH_HOST" "cat > $R.sh" < "$RUNNER_TEMP/clutch-remote.sh"
          # Old files from earlier runs are swept here rather than in a cleanup step that
          # a cancelled job would skip. `set -a` exports what the env file assigns.
          timeout 10m sshpass -e ssh $SSH_OPTS "$CLUTCH_SSH_USER@$CLUTCH_SSH_HOST" "find /tmp -maxdepth 1 -name 'clutch-ci-*' -mtime +1 -delete 2>/dev/null; set -a; . $R.env; set +a; rm -f $R.env; bash $R.sh"
