# Validate the Prometheus config and alert rules on any PR that touches them.
#
# Nothing checked these before, and the failure they have is silent in the worst way: Prometheus
# loads a config whose `rule_files` glob matches nothing, or a rules file it cannot parse, and
# carries on serving a UI that shows zero rules. From outside, "the rules are fine and nothing is
# wrong" and "no rules exist at all" look identical. This repo already learned that shape from an
# nginx include that matched nothing, passed `nginx -t`, reloaded cleanly, and loaded nothing.
#
# `promtool check config` follows rule_files and validates every rule it finds, so it covers both
# the scrape config and the alerts in one call.
name: Check monitoring config

on:
  pull_request:
    paths:
      - 'config/monitoring/prometheus/**'
      - 'docker-compose.yml'
      - 'docker-compose.mainnet.yml'
      - 'docker-compose.stage.cloudflare-flex.yml'
      - 'docker-compose.treasury.yml'
      - 'docker-compose.mainnet.treasury.yml'
      - 'scripts/check-mainnet-compose.sh'
      - '.env.mainnet.example'
      - '.github/workflows/check-monitoring-config.yml'
  workflow_dispatch:

jobs:
  promtool:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: promtool check config (and every rule it references)
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD/config/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            -v "$PWD/config/monitoring/prometheus/rules:/etc/prometheus/rules:ro" \
            --entrypoint promtool prom/prometheus:v3.1.0 \
            check config /etc/prometheus/prometheus.yml

      - name: promtool test rules (the treasury rules are scoped to their chain)
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD/config/monitoring/prometheus/rules:/etc/prometheus/rules:ro" \
            -v "$PWD/config/monitoring/prometheus/tests:/etc/prometheus/tests:ro" \
            --entrypoint promtool prom/prometheus:v3.1.0 \
            test rules /etc/prometheus/tests/treasury-chains.test.yml

      - name: The treasury jobs carry their chain label
        run: |
          set -euo pipefail
          # The promtool tests write their labels by hand, so they cannot show that the scrape config
          # really gives each job its `chain` label. TreasuryWatcherCursorStranded selects
          # {chain="testnet"}: a job that lost the label would make that rule select nothing, and it
          # would stay silent for ever while every other check here stayed green. So read the label
          # from the real file. The jobs are written as `- job_name: "<name>"`, and each has a line
          # `labels: { chain: <chain> }` under it.
          echo "=== treasury jobs and their chain label (job chain) ==="
          got=$(awk '
            function flush() { if (job ~ /(treasury-service|payment-orchestrator)$/) print job, (chain == "" ? "none" : chain) }
            /^[ ]*#/ { next }
            /^  - job_name:/ { flush(); job = $0; sub(/^  - job_name:[ ]*/, "", job); gsub(/"/, "", job); chain = ""; next }
            job != "" && /labels:/ && /chain:/ { v = $0; sub(/.*chain:[ ]*/, "", v); sub(/[ ,}].*/, "", v); chain = v }
            END { flush() }
          ' config/monitoring/prometheus/prometheus.yml | LC_ALL=C sort)
          echo "$got"
          want=$(printf '%s\n' "mainnet-payment-orchestrator mainnet" "mainnet-treasury-service mainnet" \
                               "payment-orchestrator testnet" "treasury-service testnet")
          if [ "$got" != "$want" ]; then
            echo "::error::prometheus.yml must give exactly these four treasury jobs their chain label (job chain):"
            echo "$want"
            exit 1
          fi
          echo "all four treasury jobs carry their chain label"

      - name: Every alert expression must actually parse and select something nameable
        run: |
          set -euo pipefail
          # promtool check config validates syntax. It does NOT catch an expression that parses
          # but can never match -- the shape that shipped TreasuryWatcherCursorStranded comparing
          # a labelled vector against an unlabelled aggregate, which evaluated to empty for ever
          # while reporting healthy. So: list what each rule selects, for a human to read in the
          # diff. Cheap, and the only thing that has ever caught this class here.
          # Each rule is printed from its `- alert:` line up to its `for:` or `labels:` line, with the
          # comment lines left out. The line after `- alert:` is not always the expression: a comment
          # can follow it, and an expression can run over several lines (TreasuryServiceDown has both).
          echo "=== alert expressions ==="
          awk '/^      - alert:/{p=1} /^        (for|labels):/{p=0} p && !/^ *#/' config/monitoring/prometheus/rules/*.yml || true

      - name: Compose files must parse, including both mainnet projects
        run: |
          set -euo pipefail
          # Dummy values for the two variables the base marks required; neither is read here. Each
          # network has its own env file on the host, passed with --env-file, as here.
          printf 'JWT_SECRET=ci\nGRAFANA_ADMIN_PASSWORD=ci\n' > /tmp/testnet.env
          echo "--- base ---"
          docker compose --env-file /tmp/testnet.env -f docker-compose.yml config -q
          # The stage overlay declares clutch-mainnet as external. `config` does not check that a
          # network exists, so this parses here and is still the real coupling on the host.
          echo "--- base + stage overlay ---"
          docker compose --env-file /tmp/testnet.env -f docker-compose.yml -f docker-compose.stage.cloudflare-flex.yml config -q

          # The mainnet treasury, rendered the way the host renders it: its own file and --env-file,
          # which is what keeps its secrets separate from the testnet's. `config -q` proves it parses,
          # and the guard below proves what a parse cannot: the env signer, the chain, no shared name,
          # no published port, no stage network, no setting lost from the stage services.
          echo "--- mainnet treasury ---"
          sed -e 's/#.*//' -e '/^[[:space:]]*$/d' .env.mainnet.example > /tmp/t.env
          for v in CUSTODY_TRON_ADDRESS TRONGRID_API_KEY MINT_AUTHORITY_SECRET \
                   DEPOSIT_MNEMONIC DEPOSIT_ACCOUNT_XPUB \
                   SIGNER_TOKEN TREASURY_INITIATOR_TOKEN TREASURY_APPROVER_TOKEN \
                   TREASURY_READONLY_TOKEN TREASURY_POSTGRES_PASSWORD \
                   ORCHESTRATOR_POSTGRES_PASSWORD JWT_SECRET PAYOUT_FLOAT_ADDRESS PILOT_ALLOWED_ADDRESSES \
                   MAINNET_NODE1_AUTHOR_SECRET MAINNET_NODE2_AUTHOR_SECRET MAINNET_NODE3_AUTHOR_SECRET; do
            echo "$v=ci" >> /tmp/t.env
          done
          # The mainnet chain and apps read the same file as its treasury.
          echo "--- mainnet chain + app ---"
          docker compose --env-file /tmp/t.env -f docker-compose.mainnet.yml config -q
          docker compose --env-file /tmp/t.env -f docker-compose.mainnet.treasury.yml config -q
          docker compose --env-file /tmp/t.env -f docker-compose.mainnet.treasury.yml config --format json > /tmp/mainnet.json

          # The stage side of the comparison: the base and its treasury file, as the GasFree step renders them.
          {
            for v in JWT_SECRET GRAFANA_ADMIN_PASSWORD TREASURY_POSTGRES_PASSWORD ORCHESTRATOR_POSTGRES_PASSWORD \
                     MINT_AUTHORITY_SECRET TREASURY_INITIATOR_TOKEN TREASURY_APPROVER_TOKEN TREASURY_READONLY_TOKEN \
                     SIGNER_TOKEN DEPOSIT_MNEMONIC CUSTODY_TRON_ADDRESS DEPOSIT_ACCOUNT_XPUB; do
              echo "$v=ci"
            done
          } > /tmp/s.env
          docker compose --env-file /tmp/s.env -f docker-compose.yml -f docker-compose.treasury.yml config --format json > /tmp/stage.json

          # The guard reads these keys by name, and a check that finds nothing passes. So if the shape of
          # `config --format json` changes (a network name, `internal`, or the `networks` of a service),
          # the job must stop here, loudly, and not leave the guard green on nothing. The mainnet file
          # names its networks. The stage file does not, so its network is named after the project, which
          # here is this folder: the name ends in _clutch-network.
          jq -e '.networks["treasury-network"].internal == true
                 and .networks["clutch-network"].name == "clutch-mainnet"
                 and ([.services["mainnet-treasury-service"].networks, .services["mainnet-tron-signer"].networks,
                       .services["mainnet-payment-orchestrator"].networks] | map(length) | min) > 0' /tmp/mainnet.json >/dev/null \
            || { echo "::error::mainnet.json is not the shape the guard reads: networks.treasury-network.internal must be true, networks.clutch-network.name must be clutch-mainnet, and each of the three mainnet app services must have a networks object"; exit 1; }
          jq -e '(.networks["clutch-network"].name | endswith("_clutch-network"))
                 and (([.services["treasury-service"].networks, .services["tron-signer"].networks,
                        .services["payment-orchestrator"].networks] | map(length) | min) > 0)' /tmp/stage.json >/dev/null \
            || { echo "::error::stage.json is not the shape the guard reads: networks.clutch-network.name must end in _clutch-network, and each of the three stage app services must have a networks object"; exit 1; }
          bash scripts/check-mainnet-compose.sh /tmp/stage.json /tmp/mainnet.json

          echo "all compose files parse"

      - name: GasFree settings reach every service that reads them
        run: |
          set -euo pipefail
          # One env file name per setting feeds all three treasury services, so they cannot read
          # different values. What can go wrong is a service missing a line: it then runs with
          # GasFree off while the others run with it on. Set every name to a marker and read back
          # what each service receives.
          {
            for v in JWT_SECRET GRAFANA_ADMIN_PASSWORD TREASURY_POSTGRES_PASSWORD ORCHESTRATOR_POSTGRES_PASSWORD \
                     MINT_AUTHORITY_SECRET TREASURY_INITIATOR_TOKEN TREASURY_APPROVER_TOKEN TREASURY_READONLY_TOKEN \
                     SIGNER_TOKEN DEPOSIT_MNEMONIC CUSTODY_TRON_ADDRESS DEPOSIT_ACCOUNT_XPUB; do
              echo "$v=ci"
            done
            for v in TRANSFER_RAIL GASFREE_NETWORK GASFREE_API_URL GASFREE_API_KEY GASFREE_API_SECRET \
                     GASFREE_SERVICE_PROVIDER GASFREE_ACTIVATE_FEE_MAX_USDT GASFREE_TRANSFER_FEE_MAX_USDT \
                     MIN_DEPOSIT_USDT GASFREE_EXPECTED_IMPLEMENTATION GASFREE_EXPECTED_CONTROLLER_IMPLEMENTATION \
                     PAYOUT_FLOAT_TARGET_USDT; do
              echo "$v=marker-$v"
            done
          } > /tmp/g.env
          merged=$(docker compose --env-file /tmp/g.env -f docker-compose.yml -f docker-compose.treasury.yml config --format json)
          receives() {  # receives <service> <env file name>...: each must arrive as APP_<name>, unchanged
            local svc="$1" v got
            shift
            for v in "$@"; do
              got=$(printf '%s' "$merged" | jq -r --arg s "$svc" --arg k "APP_$v" '.services[$s].environment[$k] // "MISSING"')
              if [ "$got" != "marker-$v" ]; then
                echo "::error::$svc receives APP_$v=$got, expected marker-$v"
                exit 1
              fi
            done
            echo "$svc: all $# GasFree settings"
          }
          SHARED="TRANSFER_RAIL GASFREE_NETWORK GASFREE_ACTIVATE_FEE_MAX_USDT GASFREE_TRANSFER_FEE_MAX_USDT GASFREE_EXPECTED_IMPLEMENTATION GASFREE_EXPECTED_CONTROLLER_IMPLEMENTATION"
          receives treasury-service $SHARED MIN_DEPOSIT_USDT
          receives payment-orchestrator $SHARED MIN_DEPOSIT_USDT
          receives tron-signer $SHARED GASFREE_API_URL GASFREE_API_KEY GASFREE_API_SECRET GASFREE_SERVICE_PROVIDER PAYOUT_FLOAT_TARGET_USDT

          # The mainnet file is a copy of those three services, so it has lines of its own that can lose
          # a setting. Same markers, rendered the way the step above renders it (/tmp/t.env: the example
          # without comments plus the dummy names). The markers come last, so they win.
          cp /tmp/t.env /tmp/gm.env
          grep '=marker-' /tmp/g.env >> /tmp/gm.env
          merged=$(docker compose --env-file /tmp/gm.env -f docker-compose.mainnet.treasury.yml config --format json)
          receives mainnet-treasury-service $SHARED MIN_DEPOSIT_USDT
          receives mainnet-payment-orchestrator $SHARED MIN_DEPOSIT_USDT
          receives mainnet-tron-signer $SHARED GASFREE_API_URL GASFREE_API_KEY GASFREE_API_SECRET GASFREE_SERVICE_PROVIDER PAYOUT_FLOAT_TARGET_USDT
