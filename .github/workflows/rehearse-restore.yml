# Readiness item D1: prove the backup and restore path actually works.
#
# A dump nobody has restored is a hypothesis. This runs the whole loop against stage -- dump both
# databases, encrypt, decrypt, restore into a throwaway database, count the rows, drop it -- so the
# scripts are known to work before the day someone needs them.
#
# The passphrase is generated per run and never written anywhere. That is deliberate: it makes this
# a test of the machinery rather than a backup, and it means this workflow cannot quietly become
# the thing producing backups nobody can decrypt. Real backups take their passphrase from the
# host's .env, which has to be stored off the host to be worth anything.
#
# Nothing here touches a live database. restore-treasury-db.sh creates `<db>_restore_<stamp>` and
# refuses to target anything else; DROP_AFTER=1 removes that copy at the end.

name: Rehearse restore (stage, D1)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "rehearse" to run the backup and restore rehearsal'
        required: true
      source:
        description: 'synthetic = fresh dump, ephemeral passphrase (tests the scripts). remote = newest off-host dump, real passphrase (tests the backups that exist).'
        required: false
        default: synthetic
        type: choice
        options:
          - synthetic
          - remote

concurrency:
  group: rehearse-restore
  cancel-in-progress: false

jobs:
  rehearse:
    runs-on: ubuntu-latest
    steps:
      - name: Check confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "rehearse" ]; then
            echo "Refusing: confirmation was '${{ inputs.confirm }}', expected 'rehearse'."
            exit 1
          fi

      - name: Rehearse via SSH
        env:
          SSHPASS: ${{ secrets.STAGE_SSH_PASSWORD }}
          CLUTCH_SSH_HOST: ${{ secrets.STAGE_HOST }}
          CLUTCH_SSH_USER: ${{ secrets.STAGE_USER }}
        run: |
          # Plain ssh, not appleboy/ssh-action. That action downloads a drone-ssh binary from
          # GitHub releases on EVERY run -- unconditionally, there is no skip-if-present -- and on
          # 2026-09-14 that CDN answered 504 to all six attempts of the action's own `curl --retry 5`
          # and failed a deploy. Its retry is the thing we watched lose, so retrying harder is not
          # the fix; not depending on a runtime download is. `ssh` is already on the runner.
          #
          # The script travels as a FILE, never as an argument. The 11 KB inline block this repo
          # used to carry failed three times in ways that contradicted its own source, because what
          # bash received was not what the workflow contained. One quoting layer is better than two.
          set -euo pipefail
          command -v sshpass >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq sshpass; }
          R="/tmp/clutch-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -o ServerAliveInterval=30"
          cat > "$RUNNER_TEMP/clutch-remote.sh" <<'CLUTCH_REMOTE_EOF'
          set -euo pipefail
          cd "${{ secrets.STAGE_DEPLOY_PATH }}"
          git pull --ff-only origin main

          REHEARSAL_DIR="$(mktemp -d)"
          # Remove the dumps even if a step below fails, so an encrypted copy of the whole
          # ledger is never left lying in a temp directory.
          trap 'rm -rf "$REHEARSAL_DIR"' EXIT

          if [ "${{ inputs.source }}" = "remote" ]; then
            # The disaster path, and the only version that proves anything about the backups that
            # actually exist: read them back OUT of the remote, decrypt with .env's real
            # passphrase, restore, and reconcile against the restored ledger. The synthetic run
            # below proves the scripts execute; it cannot tell you that the passphrase on this
            # host still opens the dumps sitting in the bucket, nor that what comes back out of
            # them still adds up.
            #
            # The work lives in scripts/ deliberately. Inline blocks here have failed three times
            # in ways that contradicted their own source, because what bash received was not what
            # the workflow contained.
            bash scripts/verify-restored-ledger.sh
            exit 0
          fi

          # Ephemeral, never echoed, never written to .env. Lives for this shell only.
          REHEARSAL_PASSPHRASE="$(openssl rand -base64 48)"

          echo "=== 1/3 backup into a temp directory ==="
          BACKUP_PASSPHRASE="$REHEARSAL_PASSPHRASE" \
            BACKUP_DIR="$REHEARSAL_DIR" \
            BACKUP_REMOTE="" \
            bash scripts/backup-treasury-db.sh

          echo ""
          echo "=== 2/3 restore the treasury dump into a throwaway database ==="
          TREASURY_DUMP="$(ls -1t "$REHEARSAL_DIR"/treasury-*.dump.enc | head -1)"
          BACKUP_PASSPHRASE="$REHEARSAL_PASSPHRASE" DROP_AFTER=1 \
            bash scripts/restore-treasury-db.sh "$TREASURY_DUMP"

          echo ""
          echo "=== 3/3 restore the orchestrator dump into a throwaway database ==="
          ORCH_DUMP="$(ls -1t "$REHEARSAL_DIR"/orchestrator-*.dump.enc | head -1)"
          BACKUP_PASSPHRASE="$REHEARSAL_PASSPHRASE" DROP_AFTER=1 \
            bash scripts/restore-treasury-db.sh "$ORCH_DUMP"

          echo ""
          echo "=== rehearsal complete ==="
          echo "The scripts work. What this did NOT prove, and what still closes D1:"
          echo "  - BACKUP_PASSPHRASE set in .env and stored somewhere that is NOT this host"
          echo "  - BACKUP_REMOTE set, so dumps stop sharing a disk with the databases"
          echo "  - reconciliation run green against a restored ledger, not just row counts"
          CLUTCH_REMOTE_EOF
          sshpass -e ssh $SSH_OPTS "$CLUTCH_SSH_USER@$CLUTCH_SSH_HOST" "cat > $R.sh" < "$RUNNER_TEMP/clutch-remote.sh"
          # Old files from earlier runs are swept here rather than in a cleanup step that
          # a cancelled job would skip.
          timeout 20m sshpass -e ssh $SSH_OPTS "$CLUTCH_SSH_USER@$CLUTCH_SSH_HOST" "find /tmp -maxdepth 1 -name 'clutch-ci-*' -mtime +1 -delete 2>/dev/null; bash $R.sh"
