# Set the treasury's mint caps on stage.
#
# These are SAFETY LIMITS. This workflow exists so that changing one is a deliberate, attributed act
# with a reason in the log — not an edit someone makes on the host and forgets. Put them back
# afterwards: a cap raised "temporarily" and left is a cap that no longer exists.
#
# Both caps matter. check_mint tests the per-transaction limit AND the rolling daily total, so a
# payment over the daily figure is refused even when the per-transaction one would allow it.
#
# The caps also gate ORDINARY deposits, not just manual corrections: overpayments credit what
# actually arrived, so any deposit above the per-transaction cap parks for a human.

name: Set mint caps (stage)

on:
  workflow_dispatch:
    inputs:
      per_tx:
        description: "Per-transaction cap in micro-dollars (pilot default: 50000000 = $50)"
        required: true
        default: "50000000"
      daily:
        description: "Daily cap in micro-dollars (pilot default: 500000000 = $500)"
        required: true
        default: "500000000"
      reason:
        description: "Why the limits are changing. Recorded in this log and nowhere else."
        required: true
      confirm:
        description: 'Type "set" to confirm changing a safety limit'
        required: true
        default: ""

concurrency:
  group: mint-caps
  cancel-in-progress: false

jobs:
  set:
    runs-on: ubuntu-latest
    steps:
      - name: Check the confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "set" ]; then
            echo "Refusing: confirm was '${{ inputs.confirm }}', expected 'set'."
            exit 1
          fi

      # Through env, never interpolated into the script body: a reason containing backticks or
      # $(...) would otherwise execute as shell.
      - name: Record who and why
        env:
          ACTOR: ${{ github.actor }}
          REASON: ${{ inputs.reason }}
        run: |
          echo "dispatched by $ACTOR"
          echo "reason: $REASON"

      - name: Apply via SSH
        env:
          SSHPASS: ${{ secrets.STAGE_SSH_PASSWORD }}
          CLUTCH_SSH_HOST: ${{ secrets.STAGE_HOST }}
          CLUTCH_SSH_USER: ${{ secrets.STAGE_USER }}
          PER_TX: ${{ inputs.per_tx }}
          DAILY: ${{ inputs.daily }}
        run: |
          # Plain ssh, not appleboy/ssh-action. That action downloads a drone-ssh binary from
          # GitHub releases on EVERY run -- unconditionally, there is no skip-if-present -- and on
          # 2026-09-14 that CDN answered 504 to all six attempts of the action's own `curl --retry 5`
          # and failed a deploy. Its retry is the thing we watched lose, so retrying harder is not
          # the fix; not depending on a runtime download is. `ssh` is already on the runner.
          #
          # The script travels as a FILE, never as an argument. The 11 KB inline block this repo
          # used to carry failed three times in ways that contradicted its own source, because what
          # bash received was not what the workflow contained. One quoting layer is better than two.
          set -euo pipefail
          command -v sshpass >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq sshpass; }
          R="/tmp/clutch-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -o ServerAliveInterval=30"
          # Values reach the host as a file of shell-quoted assignments and are sourced there --
          # never interpolated into the command line. That is the property the action's `envs:`
          # input gave us, kept deliberately: a workflow input must not be able to become part of
          # the command that runs. The file is deleted on the host the moment it has been read.
          : > "$RUNNER_TEMP/clutch-env.sh"
          for v in PER_TX DAILY; do printf '%s=%q\n' "$v" "${!v-}" >> "$RUNNER_TEMP/clutch-env.sh"; done
          sshpass -e ssh $SSH_OPTS "$CLUTCH_SSH_USER@$CLUTCH_SSH_HOST" "cat > $R.env" < "$RUNNER_TEMP/clutch-env.sh"
          cat > "$RUNNER_TEMP/clutch-remote.sh" <<'CLUTCH_REMOTE_EOF'
          set -euo pipefail
          cd "${{ secrets.STAGE_DEPLOY_PATH }}"
          git pull --ff-only origin main
          bash scripts/set-mint-caps.sh
          CLUTCH_REMOTE_EOF
          sshpass -e ssh $SSH_OPTS "$CLUTCH_SSH_USER@$CLUTCH_SSH_HOST" "cat > $R.sh" < "$RUNNER_TEMP/clutch-remote.sh"
          # Old files from earlier runs are swept here rather than in a cleanup step that
          # a cancelled job would skip. `set -a` exports what the env file assigns.
          timeout 10m sshpass -e ssh $SSH_OPTS "$CLUTCH_SSH_USER@$CLUTCH_SSH_HOST" "find /tmp -maxdepth 1 -name 'clutch-ci-*' -mtime +1 -delete 2>/dev/null; set -a; . $R.env; set +a; rm -f $R.env; bash $R.sh"
