# Provision Bitcart on stage: admin user, watch-only wallet, store, and the two .env values
# payment-orchestrator needs to start.
#
# Breaks a bootstrap deadlock: the orchestrator refuses to start without BITCART_TOKEN and
# BITCART_STORE_ID, but those only exist once Bitcart is running and has a store — and Bitcart is
# deliberately unpublished on the VPS, so it is reachable only from the box itself.
#
# The real work lives in scripts/provision-bitcart.sh. Keeping it in a file rather than inline is
# deliberate: as an inline script it aborted silently with no trap output and took four rounds of
# guesswork, because the SSH action's handling of a long multi-line script was itself a variable.
# A file can be `bash -n` checked and shellchecked in CI, and run by hand on the box.
name: Provision Bitcart (stage)

on:
  workflow_dispatch:
    inputs:
      custody_address:
        description: "Tron address that receives deposits. Bitcart holds NO private key for it — it can watch and invoice, never spend. That is the property that makes co-hosting the processor acceptable."
        type: string
        required: true
      usdt_contract:
        description: "TRC-20 USDT contract. Default is NILE testnet USDT; it does NOT exist on Shasta. Must be on the same network as TRONGRID_URL, or the verifier queries a chain the contract is not on and no deposit ever matches."
        type: string
        required: false
        default: "TXLAQ63Xg1NAzckPwKHvzw7CSEmLMEqcdj"

concurrency:
  group: deploy-stage # shared with the deploy: never provision and deploy at the same time
  cancel-in-progress: false

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Catch a broken script here, before it runs against the live host.
      - run: bash -n scripts/provision-bitcart.sh
      - uses: ludeeus/action-shellcheck@master
        with:
          scandir: ./scripts

  provision:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Provision via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.STAGE_HOST }}
          username: ${{ secrets.STAGE_USER }}
          password: ${{ secrets.STAGE_SSH_PASSWORD }}
          script_stop: true
          script: |
            cd "${{ secrets.STAGE_DEPLOY_PATH }}"
            git pull --ff-only || echo "Note: git pull failed — continuing with the checked-out copy"
            chmod +x scripts/provision-bitcart.sh
            bash scripts/provision-bitcart.sh '${{ inputs.custody_address }}' '${{ inputs.usdt_contract }}' clutch-stage
