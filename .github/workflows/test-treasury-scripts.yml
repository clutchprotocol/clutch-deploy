# Self-checks for the scripts that guard the treasury's settings and move its money.
#
# check-cap-invariants.sh gates every stage deploy (deploy-stage.sh): a bug in it either lets a
# broken limit through or stops every deploy. No secrets, no host access, no docker daemon — copies of the
# scripts, fixtures, and a temp directory. Same shape as test-nginx-block.yml.
#
# Any edit of a script or a workflow file runs it too (the globs in `paths`), and the last step parses every
# workflow file, so a YAML mistake shows here and not only when the workflow is first dispatched.

name: Test treasury scripts

on:
  pull_request:
    paths:
      - "scripts/**"
      - "config/node-mainnet/*.toml"
      - "docker-compose.yml"
      - "docker-compose.mainnet.yml"
      - "docker-compose.treasury.yml"
      - "docker-compose.mainnet.treasury.yml"
      - "docker-compose.stage.cloudflare-flex.yml"
      - "docker-compose.stage.treasury.yml"
      - ".env.testnet.example"
      - ".env.mainnet.example"
      - ".github/workflows/*.yml"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "config/node-mainnet/*.toml"
      - "docker-compose.yml"
      - "docker-compose.mainnet.yml"
      - "docker-compose.treasury.yml"
      - "docker-compose.mainnet.treasury.yml"
      - "docker-compose.stage.cloudflare-flex.yml"
      - "docker-compose.stage.treasury.yml"
      - ".env.testnet.example"
      - ".env.mainnet.example"
      - ".github/workflows/*.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: |
          for f in scripts/*.sh scripts/lib/*.sh; do bash -n "$f" || exit 1; done
      - name: Cap invariants
        if: ${{ !cancelled() }}
        run: bash scripts/test-cap-invariants.sh
      - name: GasFree fee check
        if: ${{ !cancelled() }}
        run: bash scripts/test-gasfree-fee-check.sh
      - name: Float activation decision
        if: ${{ !cancelled() }}
        run: bash scripts/test-activate-float.sh
      - name: GasFree settings writer
        if: ${{ !cancelled() }}
        run: bash scripts/test-set-gasfree-settings.sh
      - name: Pilot allowlist writer
        if: ${{ !cancelled() }}
        run: bash scripts/test-set-pilot-allowlist.sh
      - name: Mainnet compose guard
        if: ${{ !cancelled() }}
        run: bash scripts/test-check-mainnet-compose.sh
      - name: Chain helper
        if: ${{ !cancelled() }}
        run: bash scripts/test-chain.sh
      - name: Chain-aware tools
        if: ${{ !cancelled() }}
        run: bash scripts/test-chain-names.sh
      - name: Mainnet preflight
        if: ${{ !cancelled() }}
        run: bash scripts/test-mainnet-preflight.sh
      - name: Mainnet mint key writer
        if: ${{ !cancelled() }}
        run: bash scripts/test-mainnet-mint-key.sh
      - name: Mainnet chain reset gates
        if: ${{ !cancelled() }}
        run: bash scripts/test-reset-mainnet-chain.sh
      - name: Mainnet old-chain copies deleter
        if: ${{ !cancelled() }}
        run: bash scripts/test-delete-old-chain-copies.sh
      - name: Env file split
        if: ${{ !cancelled() }}
        run: bash scripts/test-migrate-env-files.sh
      - name: Host image cleanup
        if: ${{ !cancelled() }}
        run: bash scripts/test-prune-host-images.sh
      # A YAML mistake in a workflow file is otherwise found only after the merge, when the workflow
      # is dispatched. A block scalar, because a plain one would end at the " #" inside the ruby code.
      - name: Workflow files parse
        if: ${{ !cancelled() }}
        run: |
          ruby -ryaml -e 'ARGV.each { |f| YAML.load_file(f); puts "ok    #{f}" }' .github/workflows/*.yml
