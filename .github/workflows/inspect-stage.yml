# Read-only inspection of the stage VPS.
#
# Exists because deploying blind to this host has cost real time twice: a `chmod +x` left the
# checkout dirty and silently blocked every `git pull` for an hour, and the nginx serving stage
# turned out to be a hand-made container mounting a config that is not in this repo at all.
# Both were invisible from the deploy log and both were one `docker inspect` away.
#
# Deliberately NOT parameterised with a command input. A workflow that runs arbitrary strings on
# the production host is a remote shell with the repo's write access as its auth; the fixed
# command set below is the whole point. Add a case here when you need a new probe.
#
# Every command is read-only: ps/inspect/grep/ss. Nothing starts, stops, or writes.

name: Inspect stage (read-only)

on:
  workflow_dispatch:
    inputs:
      address:
        description: "Address for the balance probe (ignored by other probes)"
        required: false
        default: ""
      vhost:
        description: "nginx probe only: dump these vhosts' whole server blocks, comma-separated (*.clutchprotocol.io only — this log is public)"
        required: false
        default: ""
      probe:
        description: "What to inspect"
        type: choice
        default: nginx
        options:
          - nginx
          - explorer
          - containers
          - git
          - treasury
          - sweeper
          - chain
          - mainnet
          - metrics
          - balance
          - energy
          - bitcart
          - bitcart-daemon

concurrency:
  group: inspect-stage
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect via SSH
        env:
          SSHPASS: ${{ secrets.STAGE_SSH_PASSWORD }}
          CLUTCH_SSH_HOST: ${{ secrets.STAGE_HOST }}
          CLUTCH_SSH_USER: ${{ secrets.STAGE_USER }}
        run: |
          # Plain ssh, not appleboy/ssh-action. That action downloads a drone-ssh binary from
          # GitHub releases on EVERY run -- unconditionally, there is no skip-if-present -- and on
          # 2026-09-14 that CDN answered 504 to all six attempts of the action's own `curl --retry 5`
          # and failed a deploy. Its retry is the thing we watched lose, so retrying harder is not
          # the fix; not depending on a runtime download is. `ssh` is already on the runner.
          #
          # The script travels as a FILE, never as an argument. The 11 KB inline block this repo
          # used to carry failed three times in ways that contradicted its own source, because what
          # bash received was not what the workflow contained. One quoting layer is better than two.
          set -euo pipefail
          command -v sshpass >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq sshpass; }
          R="/tmp/clutch-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -o ServerAliveInterval=30"
          cat > "$RUNNER_TEMP/clutch-remote.sh" <<'CLUTCH_REMOTE_EOF'
          set -euo pipefail
          cd "${{ secrets.STAGE_DEPLOY_PATH }}"
          # `origin main`, not a bare pull: without a refspec this host resolved FETCH_HEAD to
          # every branch it had just fetched and died with "Cannot fast-forward to multiple
          # branches", so pushing two feature branches was enough to stop it updating.
          #
          # The failure is still not fatal here — a probe of a stale checkout still answers most
          # questions, and refusing to look at the host is the wrong response to not being able to
          # update it. The warning says what it means for what follows.
          git pull --ff-only origin main \
            || echo "WARNING: git pull failed — every probe below ran the checkout as it was, which may be older than main"
          # Probes live in scripts/inspect-stage.sh. Inline, this broke three times: once
          # unparseable YAML (column-0 Python ends a literal block), twice a silent exit 1
          # mid-output. Keep this wrapper trivial.
          PROBE="${{ inputs.probe }}" ADDRESS="${{ inputs.address }}" VHOST="${{ inputs.vhost }}" bash scripts/inspect-stage.sh
          CLUTCH_REMOTE_EOF
          sshpass -e ssh $SSH_OPTS "$CLUTCH_SSH_USER@$CLUTCH_SSH_HOST" "cat > $R.sh" < "$RUNNER_TEMP/clutch-remote.sh"
          # Old files from earlier runs are swept here rather than in a cleanup step that
          # a cancelled job would skip.
          timeout 10m sshpass -e ssh $SSH_OPTS "$CLUTCH_SSH_USER@$CLUTCH_SSH_HOST" "find /tmp -maxdepth 1 -name 'clutch-ci-*' -mtime +1 -delete 2>/dev/null; bash $R.sh"
