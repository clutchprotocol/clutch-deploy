# Read-only inspection of the stage VPS.
#
# Exists because deploying blind to this host has cost real time twice: a `chmod +x` left the
# checkout dirty and silently blocked every `git pull` for an hour, and the nginx serving stage
# turned out to be a hand-made container mounting a config that is not in this repo at all.
# Both were invisible from the deploy log and both were one `docker inspect` away.
#
# Deliberately NOT parameterised with a command input. A workflow that runs arbitrary strings on
# the production host is a remote shell with the repo's write access as its auth; the fixed
# command set below is the whole point. Add a case here when you need a new probe.
#
# Every command is read-only: ps/inspect/grep/ss. Nothing starts, stops, or writes.

name: Inspect stage (read-only)

on:
  workflow_dispatch:
    inputs:
      address:
        description: "Address for the balance probe (ignored by other probes)"
        required: false
        default: ""
      probe:
        description: "What to inspect"
        type: choice
        default: nginx
        options:
          - nginx
          - containers
          - git
          - treasury
          - sweeper
          - chain
          - balance
          - bitcart
          - bitcart-daemon

concurrency:
  group: inspect-stage
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.STAGE_HOST }}
          username: ${{ secrets.STAGE_USER }}
          password: ${{ secrets.STAGE_SSH_PASSWORD }}
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ secrets.STAGE_DEPLOY_PATH }}"
            git pull --ff-only || echo "Note: git pull failed — probing the checkout as-is"
            # Probes live in scripts/inspect-stage.sh. Inline, this broke three times: once
            # unparseable YAML (column-0 Python ends a literal block), twice a silent exit 1
            # mid-output. Keep this wrapper trivial.
            PROBE="${{ inputs.probe }}" ADDRESS="${{ inputs.address }}" bash scripts/inspect-stage.sh
