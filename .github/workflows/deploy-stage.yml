# Deploy stage stack on the VPS over SSH.
#
# Required repo secrets:
#   STAGE_HOST              — VPS hostname or IP
#   STAGE_USER              — SSH user (e.g. root or deploy)
#   STAGE_SSH_PASSWORD      — SSH password for that user (store in GitHub Secrets; prefer SSH keys when possible)
#   STAGE_DEPLOY_PATH       — absolute path to clutch-deploy on the server (e.g. /root/clutch-deploy)
#
# Optional:
#   STAGE_SSH_PORT          — SSH port if not 22
#
# The server must: have Docker + Compose v2, git clone of this repo at STAGE_DEPLOY_PATH (for git pull),
# and for private GHCR images: docker login ghcr.io (run once on the VPS).

name: Deploy stage (VPS)

on:
  workflow_dispatch:
    inputs:
      reset_chain:
        description: "DESTRUCTIVE and rarely needed — leave UNTICKED for normal deploys. Runs `down -v`, wiping the chain, explorer DB, Grafana/Seq, the treasury and orchestrator databases, AND Bitcart's database. That last one invalidates BITCART_TOKEN/BITCART_STORE_ID in .env, so you must re-run 'Provision Bitcart (stage)' afterwards or the orchestrator will point at a store that no longer exists. Tick ONLY after changing consensus values in config/node/*.toml, since a new ChainInit genesis cannot import onto old chain data."
        type: boolean
        default: false

  push:
    branches: [main]
    paths:
      - "docker-compose.yml"
      - "docker-compose.stage.cloudflare-flex.yml"
      - "docker-compose.treasury.yml"
      - "docker-compose.bitcart.yml"
      - "config/**"
      - ".github/workflows/deploy-stage.yml"

  repository_dispatch:
    types: [deploy-stage]

concurrency:
  group: deploy-stage
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.STAGE_HOST }}
          username: ${{ secrets.STAGE_USER }}
          password: ${{ secrets.STAGE_SSH_PASSWORD }}
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ secrets.STAGE_DEPLOY_PATH }}"
            git pull --ff-only || echo "Note: git pull failed or not a git repo — continuing"

            # Is the treasury part of this deployment? DERIVED from the host's own .env, not from
            # a workflow input.
            #
            # Two reasons it can't be an input. `inputs` is only populated for workflow_dispatch —
            # on `push` and on the repository_dispatch a sibling repo fires after publishing an
            # image, every input is the empty string. That built a CORE-ONLY file list on those
            # runs, and `up -d --remove-orphans` then removed treasury-service,
            # payment-orchestrator and the four Bitcart containers as orphans, reporting success
            # while doing it. And a manual toggle is state that drifts from reality.
            #
            # The secrets ARE the switch: the treasury cannot run without them, so their presence
            # is the honest signal. Add them to .env to enable it, remove them to disable. Every
            # trigger then behaves identically, with nothing to keep in sync.
            # BITCART_TOKEN and BITCART_STORE_ID are in this list because the ORCHESTRATOR requires
            # them too — it panics on an empty APP_BITCART_TOKEN. Leaving them out meant the deploy
            # "succeeded" into a container crash-looping for four minutes before the health gate
            # gave up, instead of stopping immediately with a legible reason.
            #
            # They come LAST in the bootstrap order, which is worth knowing: Bitcart has to be
            # running before a store and API token exist to put here. First deploy brings Bitcart
            # up and stops at this check; provision Bitcart, add the two values, deploy again.
            TREASURY_VARS="TREASURY_POSTGRES_PASSWORD ORCHESTRATOR_POSTGRES_PASSWORD \
                           MINT_AUTHORITY_SECRET TREASURY_INITIATOR_TOKEN \
                           TREASURY_APPROVER_TOKEN TREASURY_READONLY_TOKEN \
                           BITCART_TOKEN BITCART_STORE_ID"
            TREASURY_VAR_COUNT=8
            present=0; missing=""
            for v in $TREASURY_VARS; do
              if grep -qE "^${v}=.+" .env 2>/dev/null; then present=$((present+1)); else missing="$missing $v"; fi
            done

            TREASURY="false"
            if [ "$present" -eq "$TREASURY_VAR_COUNT" ]; then
              TREASURY="true"
              echo "treasury: ENABLED (all $TREASURY_VAR_COUNT secrets present in .env)"
            elif [ "$present" -gt 0 ]; then
              # Half-configured is a mistake, not an intention — refuse rather than quietly
              # deploying core-only and orphaning whatever treasury containers are running.
              echo "DEPLOY ABORTED — .env has $present of $TREASURY_VAR_COUNT treasury secrets. Missing:"
              for v in $missing; do echo "  - $v"; done
              echo ""
              echo "Nothing was changed. Add the rest to enable the treasury, or remove them all"
              echo "to deploy core-only."
              echo ""
              echo "BITCART_TOKEN / BITCART_STORE_ID come last: Bitcart must already be running to"
              echo "create a store and issue a token. If this is the first treasury deploy, remove"
              echo "the other six for now, deploy to get Bitcart up, provision it, then add all"
              echo "eight and deploy again."
              echo ""
              echo "MINT_AUTHORITY_SECRET must be a key generated FOR STAGE, never the"
              echo "publicly-committed node1 dev key used locally."
              exit 1
            else
              echo "treasury: disabled (no treasury secrets in .env) — deploying core stack only"
            fi

            # The stage overlay MUST stay last of the port-bearing files: compose MERGES port
            # lists, and its `ports: !reset []` entries are what keep the orchestrator (8091) and
            # Bitcart's admin API (8092) off this box's public interface.
            FILES="-f docker-compose.yml"
            if [ "$TREASURY" = "true" ]; then
              FILES="$FILES -f docker-compose.treasury.yml -f docker-compose.bitcart.yml"
            fi
            FILES="$FILES -f docker-compose.stage.cloudflare-flex.yml"
            # Treasury port resets live in their own file: a service key carrying only
            # `ports: !reset []` still DECLARES that service, so keeping these in the main stage
            # overlay made a core-only deploy fail with "bitcart-backend has neither an image nor
            # a build context". Applied last so the resets win the port-list merge.
            if [ "$TREASURY" = "true" ]; then
              FILES="$FILES -f docker-compose.stage.treasury.yml"
            fi
            echo "Compose files: $FILES"

            # PULL BEFORE TEARDOWN. This ordering is the whole point.
            #
            # It used to be down -v first, and a missing image then destroyed stage and left it
            # offline: the teardown succeeded, `pull` failed with "repository does not exist", and
            # `script_stop` aborted before anything came back up. Pulling first means an image
            # problem fails while the old stack is still serving.
            docker compose -p clutch-stage $FILES pull

            # Opt-in, never a default. A plain deploy must never destroy stage data; this exists
            # for the one case that genuinely needs it — a genesis change, where the new ChainInit
            # genesis cannot import onto the old chain and every node would refuse to start.
            if [ "${{ inputs.reset_chain }}" = "true" ]; then
              echo "reset_chain=true — tearing down WITH VOLUMES (chain, explorer DB, monitoring, treasury DBs)"
              docker compose -p clutch-stage $FILES down -v --remove-orphans
            fi

            docker compose -p clutch-stage $FILES up -d --force-recreate --remove-orphans

            # nginx-stage is a separate long-lived container; after --force-recreate the app
            # containers get new IPs, so nginx must re-resolve its upstreams or it 502s.
            docker exec nginx-stage nginx -s reload || docker restart nginx-stage

            # Health gate: fail the deploy loudly if the API is not reachable THROUGH nginx.
            ok=""
            for i in $(seq 1 30); do
              code=$(curl -s -o /dev/null -w "%{http_code}" -H "Host: api-stage.clutchprotocol.io" http://localhost/health || true)
              if [ "$code" = "200" ]; then ok=1; echo "api healthy via nginx"; break; fi
              echo "waiting for api (got $code)..."; sleep 2
            done
            [ -n "$ok" ] || { echo "DEPLOY FAILED: api not reachable through nginx"; exit 1; }

            # When the treasury is part of this deployment, gate on it too. The check above only
            # proves the hub API is up — an orchestrator that crash-loops on a bad config would
            # otherwise leave the deploy reporting success.
            #
            # Checked from INSIDE the network on purpose: the orchestrator is deliberately not
            # published on this host, so there is no host port to curl. treasury-service is
            # checked the same way and is even stricter — it has no published port anywhere.
            if [ "$TREASURY" = "true" ]; then
              for svc in payment-orchestrator:8091 treasury-service:8090; do
                name="${svc%%:*}"; port="${svc##*:}"
                tok=""
                for i in $(seq 1 30); do
                  if docker run --rm --network clutch-stage_clutch-network curlimages/curl:8.10.1 \
                       -sf -m 5 "http://${name}:${port}/health" >/dev/null 2>&1; then
                    tok=1; echo "${name} healthy"; break
                  fi
                  sleep 2
                done
                [ -n "$tok" ] || { echo "DEPLOY FAILED: ${name} not healthy"; docker logs "clutch-stage-${name}-1" 2>&1 | tail -30; exit 1; }
              done
            fi
