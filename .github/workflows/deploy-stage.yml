# Deploy stage stack on the VPS over SSH.
#
# Required repo secrets:
#   STAGE_HOST              — VPS hostname or IP
#   STAGE_USER              — SSH user (e.g. root or deploy)
#   STAGE_SSH_PASSWORD      — SSH password for that user (store in GitHub Secrets; prefer SSH keys when possible)
#   STAGE_DEPLOY_PATH       — absolute path to clutch-deploy on the server (e.g. /root/clutch-deploy)
#
# Optional:
#   STAGE_SSH_PORT          — SSH port if not 22
#
# The server must: have Docker + Compose v2, git clone of this repo at STAGE_DEPLOY_PATH (for git pull),
# and for private GHCR images: docker login ghcr.io (run once on the VPS).

name: Deploy stage (VPS)

on:
  workflow_dispatch:
    inputs:
      reset_chain:
        description: "DESTRUCTIVE and rarely needed — leave UNTICKED for normal deploys. Runs `down -v`, wiping the chain, explorer DB, Grafana/Seq, the treasury and orchestrator databases, AND Bitcart's database. That last one invalidates BITCART_TOKEN/BITCART_STORE_ID in .env, so you must re-run 'Provision Bitcart (stage)' afterwards or the orchestrator will point at a store that no longer exists. Tick ONLY after changing consensus values in config/node/*.toml, since a new ChainInit genesis cannot import onto old chain data."
        type: boolean
        default: false

  push:
    branches: [main]
    paths:
      - "docker-compose.yml"
      - "docker-compose.stage.cloudflare-flex.yml"
      - "docker-compose.treasury.yml"
      - "docker-compose.bitcart.yml"
      - "config/**"
      - ".github/workflows/deploy-stage.yml"
      # The deploy logic itself lives here now. Without this, editing scripts/deploy-stage.sh
      # changes what a deploy DOES but never triggers one — the fix sits in main looking merged.
      - "scripts/**"

  repository_dispatch:
    types: [deploy-stage]

concurrency:
  group: deploy-stage
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.STAGE_HOST }}
          username: ${{ secrets.STAGE_USER }}
          password: ${{ secrets.STAGE_SSH_PASSWORD }}
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ secrets.STAGE_DEPLOY_PATH }}"
            # `origin main`, not a bare pull. Without a refspec this host resolved FETCH_HEAD to
            # every branch it had just fetched and died with "Cannot fast-forward to multiple
            # branches" — so pushing two feature branches was enough to stop the host updating.
            #
            # And no `|| echo ... continuing`. It swallowed exactly that failure: the deploy went on
            # to run whatever scripts and compose files the host already had, reported success, and
            # the one line saying the pull had failed was three hundred lines up the log. A deploy
            # that silently ships the previous commit is worse than a deploy that stops.
            git pull --ff-only origin main
            # Everything else lives in scripts/deploy-stage.sh. Keep this wrapper tiny.
            #
            # The deploy logic used to be an 11 KB inline block here. It failed three times in a
            # row in ways that contradicted the source — exit 1 with no message and no ERR trap,
            # twice, then a syntax error at "line 370" of a 208-line script that passes bash -n.
            # What bash received was not what the workflow contained; the block had outgrown the
            # trip through YAML, the ssh-action and `bash -c`, and the failure point moved every
            # time the text grew. Two wrong fixes came out of reading it as a logic bug.
            #
            # Run with `bash`, not the exec bit: `chmod +x` on a tracked file reads as a local
            # modification and silently blocks `git pull --ff-only` on this host, which once kept
            # four fixes off the server for an hour.
            #
            # git pull stays here, above the call, so the script that runs is the one just pulled.
            RESET_CHAIN="${{ inputs.reset_chain }}" bash scripts/deploy-stage.sh
