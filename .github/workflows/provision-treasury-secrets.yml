# Fill in the treasury secrets stage's .env is missing, once.
#
# stage's .env is hand-maintained on the host -- deploy-stage.sh reads it and never writes it --
# which normally means SSHing in with the password to provision it. This does the same work from
# here, so the password stays in GitHub's secret store.
#
# WRITES to the host, unlike inspect-stage.yml. Two things keep that safe:
#
#   * scripts/provision-treasury-secrets.sh only ever writes a variable that is ABSENT. Re-running
#     cannot mint a second deposit wallet over the first -- which would orphan every address the
#     first one had already handed out, permanently, while they carry on receiving.
#   * the confirm input has to be typed. This is not a button to hit while looking at something
#     else.
#
# It prints variable NAMES, plus the account xpub and the fee address. Both of those are public by
# construction: an xpub derives receive addresses and cannot spend, and the fee address is where
# TRX gets sent. The mnemonic is piped straight into .env and never reaches stdout -- assume this
# log is public.

name: Provision treasury secrets (stage, writes .env)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "provision" to confirm writing to the stage host'
        required: true
        default: ""

concurrency:
  group: provision-treasury-secrets
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - name: Check the confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "provision" ]; then
            echo "Refusing: confirm was '${{ inputs.confirm }}', expected 'provision'."
            exit 1
          fi

      - name: Provision via SSH
        env:
          SSHPASS: ${{ secrets.STAGE_SSH_PASSWORD }}
          CLUTCH_SSH_HOST: ${{ secrets.STAGE_HOST }}
          CLUTCH_SSH_USER: ${{ secrets.STAGE_USER }}
          # Optional. Absent, the script says so and stage keeps polling TronGrid unkeyed.
          # A SECRET rather than a workflow input on purpose: dispatch inputs are displayed in
          # plain text in the run UI, secrets are masked in the log.
          TRONGRID_API_KEY: ${{ secrets.TRONGRID_API_KEY }}
        run: |
          # Plain ssh, not appleboy/ssh-action. That action downloads a drone-ssh binary from
          # GitHub releases on EVERY run -- unconditionally, there is no skip-if-present -- and on
          # 2026-09-14 that CDN answered 504 to all six attempts of the action's own `curl --retry 5`
          # and failed a deploy. Its retry is the thing we watched lose, so retrying harder is not
          # the fix; not depending on a runtime download is. `ssh` is already on the runner.
          #
          # The script travels as a FILE, never as an argument. The 11 KB inline block this repo
          # used to carry failed three times in ways that contradicted its own source, because what
          # bash received was not what the workflow contained. One quoting layer is better than two.
          set -euo pipefail
          command -v sshpass >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq sshpass; }
          R="/tmp/clutch-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -o ServerAliveInterval=30"
          # Values reach the host as a file of shell-quoted assignments and are sourced there --
          # never interpolated into the command line. That is the property the action's `envs:`
          # input gave us, kept deliberately: a workflow input must not be able to become part of
          # the command that runs. The file is deleted on the host the moment it has been read.
          : > "$RUNNER_TEMP/clutch-env.sh"
          for v in TRONGRID_API_KEY; do printf '%s=%q\n' "$v" "${!v-}" >> "$RUNNER_TEMP/clutch-env.sh"; done
          sshpass -e ssh $SSH_OPTS "$CLUTCH_SSH_USER@$CLUTCH_SSH_HOST" "cat > $R.env" < "$RUNNER_TEMP/clutch-env.sh"
          cat > "$RUNNER_TEMP/clutch-remote.sh" <<'CLUTCH_REMOTE_EOF'
          set -euo pipefail
          cd "${{ secrets.STAGE_DEPLOY_PATH }}"
          git pull --ff-only origin main
          bash scripts/provision-treasury-secrets.sh
          CLUTCH_REMOTE_EOF
          sshpass -e ssh $SSH_OPTS "$CLUTCH_SSH_USER@$CLUTCH_SSH_HOST" "cat > $R.sh" < "$RUNNER_TEMP/clutch-remote.sh"
          # Old files from earlier runs are swept here rather than in a cleanup step that
          # a cancelled job would skip. The sourcing runs under an explicit `bash -c` because
          # `printf %q` emits bash quoting ($'...' for a newline), which the remote login shell
          # is not guaranteed to be able to parse.
          timeout 10m sshpass -e ssh $SSH_OPTS "$CLUTCH_SSH_USER@$CLUTCH_SSH_HOST" "find /tmp -maxdepth 1 -name 'clutch-ci-*' -mtime +1 -delete 2>/dev/null; bash -c 'set -a; . $R.env; set +a; rm -f $R.env; exec bash $R.sh'"
