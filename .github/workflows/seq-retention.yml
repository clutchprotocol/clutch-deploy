# Show or set how long Seq keeps logs (scripts/seq-retention.sh). `chain` picks the Seq: stage is the
# testnet's (seq-stage.clutchprotocol.io), mainnet is mainnet's own (seq.clutchprotocol.io, since
# 2026-10-16). "Mainnet — start Seq" already sets 7 days on mainnet's; this is for checking it.
#
# Two typed words:
#   CHECK                 shows the retention policies and the size of Seq's data. Changes nothing.
#   SET SEQ RETENTION     adds a policy that deletes every log event older than 7 days.

name: Stage host — Seq log retention

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "CHECK" to look, or "SET SEQ RETENTION" to keep 7 days of logs'
        required: true
        default: ""
      chain:
        description: "Which Seq"
        type: choice
        options: [stage, mainnet]
        default: stage

concurrency:
  group: seq-retention
  cancel-in-progress: false

jobs:
  retention:
    runs-on: ubuntu-latest
    steps:
      - name: Check the confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          case "$CONFIRM" in
            "CHECK"|"SET SEQ RETENTION") ;;
            *) echo "Refusing: confirm was '$CONFIRM', expected 'CHECK' or 'SET SEQ RETENTION'."; exit 1 ;;
          esac

      - name: Run it via SSH
        env:
          SSHPASS: ${{ secrets.STAGE_SSH_PASSWORD }}
          CLUTCH_SSH_HOST: ${{ secrets.STAGE_HOST }}
          CLUTCH_SSH_USER: ${{ secrets.STAGE_USER }}
          CONFIRM: ${{ inputs.confirm }}
          CHAIN: ${{ inputs.chain }}
        run: |
          # The same transport as stage-prune-images.yml: the mode is one of two fixed words chosen
          # on the runner and reaches the host as a file of shell-quoted assignments.
          set -euo pipefail
          command -v sshpass >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq sshpass; }
          if [ "$CONFIRM" = "SET SEQ RETENTION" ]; then MODE=apply; else MODE=check; fi
          R="/tmp/clutch-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -o ServerAliveInterval=30"
          : > "$RUNNER_TEMP/clutch-env.sh"
          case "$CHAIN" in stage|mainnet) ;; *) echo "Refusing: chain '$CHAIN'."; exit 1 ;; esac
          for v in MODE CHAIN; do printf '%s=%q\n' "$v" "${!v-}" >> "$RUNNER_TEMP/clutch-env.sh"; done
          sshpass -e ssh $SSH_OPTS "$CLUTCH_SSH_USER@$CLUTCH_SSH_HOST" "cat > $R.env" < "$RUNNER_TEMP/clutch-env.sh"
          cat > "$RUNNER_TEMP/clutch-remote.sh" <<'CLUTCH_REMOTE_EOF'
          set -euo pipefail
          cd "${{ secrets.STAGE_DEPLOY_PATH }}"
          git pull --ff-only origin main
          MODE="$MODE" CHAIN="$CHAIN" bash scripts/seq-retention.sh
          CLUTCH_REMOTE_EOF
          sshpass -e ssh $SSH_OPTS "$CLUTCH_SSH_USER@$CLUTCH_SSH_HOST" "cat > $R.sh" < "$RUNNER_TEMP/clutch-remote.sh"
          timeout 10m sshpass -e ssh $SSH_OPTS "$CLUTCH_SSH_USER@$CLUTCH_SSH_HOST" "find /tmp -maxdepth 1 -name 'clutch-ci-*' -mtime +1 -delete 2>/dev/null; bash -c 'set -a; . $R.env; set +a; rm -f $R.env; exec bash $R.sh'"
