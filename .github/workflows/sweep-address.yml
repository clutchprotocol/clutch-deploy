# Sweep one deposit address into custody, by hand.
#
# The automatic sweeper collects addresses whose mint intent reached `credited` or `submitted`, and
# deliberately ignores everything else. An intent that ends `failed` therefore strands real USDT at a
# real address: nothing collects it, and reconciliation stops counting it, because a `failed` row is
# outside the reserve sum. The money is still there; only the bookkeeping has let go of it.
#
# This workflow is the way back. It is manual on purpose — a sweep moves money, so it should be an
# attributed act with a reason in this log, not something a worker decides.
#
# It hands tron-signer a derivation INDEX and nothing else, which is the whole reason that API takes
# an index: the destination is the signer's own config and no caller can redirect it. If you find
# yourself wanting to add a `to` or an `amount` here, you want a different tool.
#
# This does NOT credit anyone CLT. Sweeping restores custody and the reserve; paying a depositor what
# a failed mint owed them is a separate correction through mint-intent-create.yml, and that one can
# only pass the reserve check after the sweep has landed.

name: Sweep one deposit address (stage)

on:
  workflow_dispatch:
    inputs:
      address:
        description: "The TRON deposit address to sweep into custody"
        required: true
      reason:
        description: "Why this address is being swept by hand. Recorded in this log and nowhere else."
        required: true
      confirm:
        description: 'Type "sweep" to confirm moving money'
        required: true
        default: ""

concurrency:
  group: sweep-address
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Check the confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "sweep" ]; then
            echo "Refusing: confirm was '${{ inputs.confirm }}', expected 'sweep'."
            exit 1
          fi

      # Through env, never interpolated into the script body: a reason containing backticks or
      # $(...) would otherwise execute as shell.
      - name: Record who and why
        env:
          ACTOR: ${{ github.actor }}
          REASON: ${{ inputs.reason }}
          ADDRESS: ${{ inputs.address }}
        run: |
          echo "dispatched by $ACTOR"
          echo "address: $ADDRESS"
          echo "reason: $REASON"

      - name: Sweep via SSH
        env:
          SSHPASS: ${{ secrets.STAGE_SSH_PASSWORD }}
          CLUTCH_SSH_HOST: ${{ secrets.STAGE_HOST }}
          CLUTCH_SSH_USER: ${{ secrets.STAGE_USER }}
          ADDRESS: ${{ inputs.address }}
        run: |
          # Plain ssh, not appleboy/ssh-action. That action downloads a drone-ssh binary from
          # GitHub releases on EVERY run -- unconditionally, there is no skip-if-present -- and on
          # 2026-09-14 that CDN answered 504 to all six attempts of the action's own `curl --retry 5`
          # and failed a deploy. Its retry is the thing we watched lose, so retrying harder is not
          # the fix; not depending on a runtime download is. `ssh` is already on the runner.
          #
          # The script travels as a FILE, never as an argument. The 11 KB inline block this repo
          # used to carry failed three times in ways that contradicted its own source, because what
          # bash received was not what the workflow contained. One quoting layer is better than two.
          set -euo pipefail
          command -v sshpass >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq sshpass; }
          R="/tmp/clutch-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -o ServerAliveInterval=30"
          # Values reach the host as a file of shell-quoted assignments and are sourced there --
          # never interpolated into the command line. That is the property the action's `envs:`
          # input gave us, kept deliberately: a workflow input must not be able to become part of
          # the command that runs. The file is deleted on the host the moment it has been read.
          : > "$RUNNER_TEMP/clutch-env.sh"
          for v in ADDRESS; do printf '%s=%q\n' "$v" "${!v-}" >> "$RUNNER_TEMP/clutch-env.sh"; done
          sshpass -e ssh $SSH_OPTS "$CLUTCH_SSH_USER@$CLUTCH_SSH_HOST" "cat > $R.env" < "$RUNNER_TEMP/clutch-env.sh"
          cat > "$RUNNER_TEMP/clutch-remote.sh" <<'CLUTCH_REMOTE_EOF'
          set -euo pipefail
          cd "${{ secrets.STAGE_DEPLOY_PATH }}"
          git pull --ff-only origin main
          bash scripts/sweep-address.sh
          CLUTCH_REMOTE_EOF
          sshpass -e ssh $SSH_OPTS "$CLUTCH_SSH_USER@$CLUTCH_SSH_HOST" "cat > $R.sh" < "$RUNNER_TEMP/clutch-remote.sh"
          # Old files from earlier runs are swept here rather than in a cleanup step that
          # a cancelled job would skip. The sourcing runs under an explicit `bash -c` because
          # `printf %q` emits bash quoting ($'...' for a newline), which the remote login shell
          # is not guaranteed to be able to parse.
          timeout 10m sshpass -e ssh $SSH_OPTS "$CLUTCH_SSH_USER@$CLUTCH_SSH_HOST" "find /tmp -maxdepth 1 -name 'clutch-ci-*' -mtime +1 -delete 2>/dev/null; bash -c 'set -a; . $R.env; set +a; rm -f $R.env; exec bash $R.sh'"
