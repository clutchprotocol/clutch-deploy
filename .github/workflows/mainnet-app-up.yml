# Bring up the mainnet APP services (Hub API + demo app). Not the validators.
#
# Separate from mainnet-start.yml because that one refuses to run when the clutch-main project
# already has containers -- it exists to start a chain that does not exist yet, and weakening that
# guard so it could also add services would remove the check that matters most.
#
# Mainnet has its own pins in docker-compose.mainnet.yml, and a stage deploy never moves them. With
# `promote` ticked (the default), this run first copies the Hub API and demo app tags that STAGE is
# pinned to into the mainnet pins and commits that to main. So "update mainnet to the latest build"
# means "to what stage already runs", and a build nobody has seen on stage cannot reach mainnet here.
#
# The `up` names only the two services AND passes --no-deps. The flag is the part that protects the
# validators: without it compose also converges every dependency (hub-api -> node3 -> node2 -> node1)
# and recreates any of them whose config or local image changed. They are authoring a live chain,
# so the job also compares their start times before and after, and fails if either moved.
name: Mainnet — bring up the app services

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type UP to run"
        required: true
      promote:
        description: "Copy the Hub API and demo app tags stage runs into the mainnet pins first. Untick to redeploy mainnet's current pins."
        type: boolean
        default: true

jobs:
  pin:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check the confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          [ "$CONFIRM" = "UP" ] || { echo "::error::type UP to run"; exit 1; }

      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Promote the stage tags to mainnet
        if: ${{ inputs.promote }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          api=$(bash scripts/set-image.sh stage clutch-hub-api)
          demo=$(bash scripts/set-image.sh stage clutch-hub-demo-app)
          echo "stage runs clutch-hub-api=$api clutch-hub-demo-app=$demo"
          echo "mainnet had clutch-hub-api=$(bash scripts/set-image.sh mainnet clutch-hub-api) clutch-hub-demo-app=$(bash scripts/set-image.sh mainnet clutch-hub-demo-app)"
          PUSH=1 bash scripts/set-image.sh mainnet clutch-hub-api="$api" clutch-hub-demo-app="$demo"

  up:
    needs: pin
    runs-on: ubuntu-latest
    steps:
      - name: Start them on the stage host
        env:
          STAGE_HOST: ${{ secrets.STAGE_HOST }}
          STAGE_USER: ${{ secrets.STAGE_USER }}
          STAGE_SSH_PASSWORD: ${{ secrets.STAGE_SSH_PASSWORD }}
          DEPLOY_PATH: ${{ secrets.STAGE_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          [ -n "$DEPLOY_PATH" ] || { echo "::error::STAGE_DEPLOY_PATH is empty"; exit 1; }
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass >/dev/null

          # No `set -x`: the host .env holds the deposit mnemonic and the mint credentials.
          remote=$(cat <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH_R"
          # The pin job has just committed the tags to main, and this checkout only moves when told
          # to. Without this pull, `up` would deploy whatever compose file the host already had.
          # `origin main` for the reason deploy-stage.yml gives: a bare pull once died on "Cannot
          # fast-forward to multiple branches". A failed pull stops the run rather than deploying
          # the previous commit.
          git pull --ff-only origin main
          C="docker compose -p clutch-main -f docker-compose.mainnet.yml"

          if ! grep -q '^MAINNET_JWT_SECRET=' .env; then
            echo "::error::MAINNET_JWT_SECRET is not in .env"
            echo "It must be a DIFFERENT value from JWT_SECRET. Sharing one would make a token"
            echo "issued by the testnet hub valid on the mainnet hub."
            echo "Generate one on this host with:  openssl rand -hex 32"
            exit 1
          fi
          if [ "$(grep '^MAINNET_JWT_SECRET=' .env | cut -d= -f2-)" = "$(grep '^JWT_SECRET=' .env | cut -d= -f2-)" ]; then
            echo "::error::MAINNET_JWT_SECRET is identical to JWT_SECRET. Refusing."
            exit 1
          fi

          validators() {
            for n in 1 2 3; do
              echo "mainnet-node${n} $(docker inspect -f '{{.Config.Image}} started {{.State.StartedAt}}' clutch-main-mainnet-node${n}-1 2>/dev/null || echo '?')"
            done
          }
          before=$(validators)

          $C pull mainnet-hub-api mainnet-demo-app
          $C up -d --no-deps mainnet-hub-api mainnet-demo-app
          $C ps

          echo ""
          echo "=== waiting for the hub API to answer ==="
          for _ in $(seq 1 20); do
            if docker exec clutch-main-mainnet-hub-api-1 curl -fsS --max-time 4 http://127.0.0.1:3000/health >/dev/null 2>&1; then
              echo "health: OK"; break
            fi
            sleep 5
          done
          docker exec clutch-main-mainnet-hub-api-1 curl -fsS --max-time 5 http://127.0.0.1:3000/health 2>&1 | head -5 \
            || { echo "::error::the hub API never answered /health"; $C logs --tail 40 mainnet-hub-api; exit 1; }

          echo ""
          echo "=== reloading nginx ==="
          # nginx resolves these upstreams by container name once, when its config loads. `up`
          # just gave the recreated containers new IPs, so without a reload the edge answers 502
          # for app. and api. until something else reloads nginx. That happened on 2026-09-25:
          # about 5 minutes of 502 on mainnet, while every check in this job passed. Same reload
          # as scripts/deploy-stage.sh.
          NGINX_C=$(docker ps --format '{{.Names}}' | grep -x 'nginx-stage' || true)
          [ -n "$NGINX_C" ] || { echo "::error::no running container named nginx-stage"; exit 1; }
          docker exec "$NGINX_C" nginx -t
          docker exec "$NGINX_C" nginx -s reload
          echo "nginx: reloaded"

          echo ""
          echo "=== is it reading the MAINNET chain? ==="
          # The decisive check. A hub pointed at the wrong node would answer /health just as
          # happily while serving another chain's blocks.
          $C logs --tail 30 mainnet-hub-api 2>&1 | grep -aiE "node|ws://|connect" | tail -8 || true

          echo ""
          echo "=== what runs now ==="
          for s in mainnet-hub-api mainnet-demo-app; do
            echo "  $s: $(docker inspect -f '{{.Config.Image}}' clutch-main-${s}-1 2>/dev/null || echo '?')"
          done

          echo ""
          echo "=== validators untouched? ==="
          after=$(validators)
          echo "$after" | sed 's/^/  /'
          if [ "$before" != "$after" ]; then
            echo "::error::a mainnet validator changed during this run. Before:"
            echo "$before" | sed 's/^/  /'
            exit 1
          fi
          echo "  unchanged"
          REMOTE
          )

          set +e
          out=$(sshpass -p "$STAGE_SSH_PASSWORD" ssh -o StrictHostKeyChecking=no \
                  "$STAGE_USER@$STAGE_HOST" \
                  "DEPLOY_PATH_R='$DEPLOY_PATH' bash -s" <<< "$remote" 2>&1)
          rc=$?
          set -e
          echo "$out"
          [ "$rc" -eq 0 ] || exit "$rc"

      # Checked from outside, through Cloudflare and nginx, because that is what users reach.
      # Every check on the host can pass while the edge answers 502 (see the reload above).
      - name: Check the mainnet hosts from outside
        run: |
          set -euo pipefail
          for url in https://app.clutchprotocol.io/ https://api.clutchprotocol.io/health; do
            code=000
            for _ in $(seq 1 12); do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$url" || true)
              [ "$code" = "200" ] && break
              sleep 5
            done
            echo "$url -> $code"
            [ "$code" = "200" ] || { echo "::error::$url answers $code from outside"; exit 1; }
          done
