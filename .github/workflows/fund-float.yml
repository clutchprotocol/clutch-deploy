# Move the fee account's misplaced USDT into the payout float.
#
# The fee account at <account>/1/0 pays TRX energy; USDT there is misplaced by definition, and
# because reserve is custody plus unswept deposits plus the float, it is counted in no bucket at
# all. This moves it to <account>/2/0, which redemptions pay out from.
#
# It moves money, so it is manual and attributed, like sweep-address. It takes no address, no
# amount and no destination, because the endpoint behind it takes none either: both ends are
# derived by the signer from its own mnemonic. If you find yourself wanting to add an input here,
# you want a different tool.
#
# THE RESERVE RISES, AND THAT IS ALL. Reconciliation compares the chain-read reserve against ledger
# liability only as `reserve < liability -> mismatch`, so moving money into a counted bucket makes a
# mismatch less likely and the run should stay `ok`. It does NOT cause over_backed_drift, which
# compares on-chain supply against ledger liability and means something quite different.

name: Fund the payout float (stage)

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why the float is being funded now. Recorded in this log and nowhere else."
        required: true
      confirm:
        description: 'Type "fund" to confirm moving money'
        required: true
        default: ""

concurrency:
  group: fund-float
  cancel-in-progress: false

jobs:
  fund:
    runs-on: ubuntu-latest
    steps:
      - name: Check the confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "fund" ]; then
            echo "Refusing: confirm was '${{ inputs.confirm }}', expected 'fund'."
            exit 1
          fi

      # Through env, never interpolated into the script body: a reason containing backticks or
      # $(...) would otherwise execute as shell.
      - name: Record who and why
        env:
          ACTOR: ${{ github.actor }}
          REASON: ${{ inputs.reason }}
        run: |
          echo "dispatched by $ACTOR"
          echo "reason: $REASON"

      - name: Fund via SSH
        env:
          SSHPASS: ${{ secrets.STAGE_SSH_PASSWORD }}
          CLUTCH_SSH_HOST: ${{ secrets.STAGE_HOST }}
          CLUTCH_SSH_USER: ${{ secrets.STAGE_USER }}
        run: |
          # Plain ssh, not appleboy/ssh-action. That action downloads a drone-ssh binary from
          # GitHub releases on EVERY run -- unconditionally, there is no skip-if-present -- and on
          # 2026-09-14 that CDN answered 504 to all six attempts of the action's own `curl --retry 5`
          # and failed a deploy. Its retry is the thing we watched lose, so retrying harder is not
          # the fix; not depending on a runtime download is. `ssh` is already on the runner.
          #
          # The script travels as a FILE, never as an argument. The 11 KB inline block this repo
          # used to carry failed three times in ways that contradicted its own source, because what
          # bash received was not what the workflow contained. One quoting layer is better than two.
          set -euo pipefail
          command -v sshpass >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq sshpass; }
          R="/tmp/clutch-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -o ServerAliveInterval=30"
          cat > "$RUNNER_TEMP/clutch-remote.sh" <<'CLUTCH_REMOTE_EOF'
          set -euo pipefail
          cd "${{ secrets.STAGE_DEPLOY_PATH }}"
          git pull --ff-only origin main
          bash scripts/fund-float.sh
          CLUTCH_REMOTE_EOF
          sshpass -e ssh $SSH_OPTS "$CLUTCH_SSH_USER@$CLUTCH_SSH_HOST" "cat > $R.sh" < "$RUNNER_TEMP/clutch-remote.sh"
          # Old files from earlier runs are swept here rather than in a cleanup step that
          # a cancelled job would skip. `set -a` exports what the env file assigns.
          timeout 10m sshpass -e ssh $SSH_OPTS "$CLUTCH_SSH_USER@$CLUTCH_SSH_HOST" "find /tmp -maxdepth 1 -name 'clutch-ci-*' -mtime +1 -delete 2>/dev/null; bash $R.sh"
