# Run the nginx block script's self-check.
#
# That script rewrites, in place, the single nginx config serving the stage host -- including
# vhosts belonging to another compose project. Three of its bugs reached that host, and every one
# of them passed `nginx -t`: an include that could never load anything, a vhost guard that missed
# one-line server blocks, and a `nullglob` that leaked out of a subshell. A fourth, a blank line
# added per deploy, was caught by this check before it shipped.
#
# No secrets, no host access, no docker: a fixture and a temp directory.

name: Test nginx block script

on:
  pull_request:
    paths:
      - "scripts/ensure-nginx-clutch-block.sh"
      - "scripts/test-nginx-clutch-block.sh"
      # Every directory the script reads, not just the first one it read. clutch.http/ and
      # clutch.shared/ were added later and were not listed, so the rate-limit config went
      # through with no checks run at all -- and an absent check reads exactly like a pass.
      - "config/nginx/clutch.d/**"
      - "config/nginx/clutch.http/**"
      - "config/nginx/clutch.shared/**"
      - ".github/workflows/test-nginx-block.yml"
  push:
    branches: [main]
    paths:
      - "scripts/ensure-nginx-clutch-block.sh"
      - "scripts/test-nginx-clutch-block.sh"
      - "config/nginx/clutch.d/**"
      - "config/nginx/clutch.http/**"
      - "config/nginx/clutch.shared/**"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: |
          bash -n scripts/ensure-nginx-clutch-block.sh
          bash -n scripts/test-nginx-clutch-block.sh
      - name: Self-check
        run: bash scripts/test-nginx-clutch-block.sh
      # The two /payment/ routes differ in ONE word, and swapping it is the dangerous mistake: a mainnet
      # deposit panel pointed at the testnet orchestrator shows a real depositor an address watched by a
      # service that can only see fake money, and credits them nothing. The mainnet file may close the
      # route (return 503) or proxy to its own orchestrator, and never names the stage one.
      - name: Each payment route names its own orchestrator
        run: |
          set -euo pipefail
          main=config/nginx/clutch.d/app.clutchprotocol.io/payment.conf
          stage=config/nginx/clutch.d/app-stage.clutchprotocol.io/payment.conf
          if grep -qE 'proxy_pass[[:space:]]+http://payment-orchestrator' "$main"; then
            echo "::error::$main proxies to the STAGE orchestrator (payment-orchestrator). Mainnet must use mainnet-payment-orchestrator."
            exit 1
          fi
          grep -qE 'proxy_pass[[:space:]]+http://mainnet-payment-orchestrator:8091;|return 503' "$main" \
            || { echo "::error::$main must either proxy to mainnet-payment-orchestrator:8091 or answer 503"; exit 1; }
          grep -qE 'proxy_pass[[:space:]]+http://payment-orchestrator:8091;' "$stage" \
            || { echo "::error::$stage must proxy to payment-orchestrator:8091"; exit 1; }
          echo "ok: mainnet names mainnet-payment-orchestrator (or 503), stage names payment-orchestrator"
