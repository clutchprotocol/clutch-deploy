# Clutch Hub API config - Docker deployment
# Node URL: use node1 container hostname
serve_metric_enabled = true
serve_metric_addr = "0.0.0.0:9090"
ws_addr = "0.0.0.0:3000"
clutch_node_ws_url = "ws://node1:8081/ws"
log_level = "info"
seq_url = "http://seq:80"
seq_api_key = "FZii3D6ILDI38a0oIeDL"
# Committed fallback only — override per-environment with APP_JWT_SECRET (see .env.example).
# hub-api refuses to start on an empty/placeholder/short secret (src/hub/configuration.rs).
jwt_secret = "b93ee84f5c75b27cdcaa1ddbb2bd74bbf9b3ed7d2b1effb06ab0a71b61467caf"
jwt_expiration_hours = 6
# "*" here; override per-environment with APP_ALLOWED_ORIGINS (see .env.example).
allowed_origins = "*"

# Faucet: POST /faucet { "address": "0x..." } — test networks only; requires a funded key.
faucet_enabled = true
faucet_private_key = "d2c446110cfcecbdf05b2be528e72483de5b6f7ef9c7856df2f81f48e9f2748f"
# $100 at the peg of 1 USD = 1,000,000 CLT. Must match clutch-hub-api's own default;
# 1000 was $0.001 here, exactly one tx_fee, leaving a funded account unable to ride.
faucet_amount_clt = 100000000

# App-developer referrers injected by Hub API (clients must not pass referrer).
default_ride_request_referrer = "0x0912514c7cc3eec2b2dab4e1d150c4b5eaee5a6f"
default_ride_offer_referrer = "0x0912514c7cc3eec2b2dab4e1d150c4b5eaee5a6f"
