# Prometheus Configuration for Clutch Protocol
global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alerting rules for the money path (readiness item D3). Everything they reference was already
# measured and logged; nothing EVALUATED it, so a reconciliation mismatch bumped a gauge nobody
# watched. Rules fire here and show up in Prometheus and Grafana; delivering them to a human needs
# an Alertmanager route or a Grafana contact point — see docs/ALERTING.md.
rule_files:
  - /etc/prometheus/rules/*.yml

# Where a firing rule goes. Without this block Prometheus evaluates every rule correctly, shows
# them firing in its own UI, and tells nobody -- which is the state readiness item D3 describes and
# which is indistinguishable, from outside, from having no rules at all.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

# TWO CHAINS share this Prometheus since 2026-09-19: the testnet (chain_id 2077, node1..3 on
# 3001-3003) and the mainnet (chain_id 1000, mainnet-node1..3 on 3101-3103). Every node target
# carries a `chain` label, and every rule and query that aggregates over nodes MUST scope by it.
# Unscoped, `max(latest_block_index) - min(latest_block_index)` compares a chain at height 17,000
# with one at height 10 and fires for ever, while `max(delta(...)) == 0` stops firing for either
# chain as long as the other advances. The label is what makes "the chain stalled" mean one chain.
scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "node1"
    static_configs:
      - targets: ["node1:3001"]
        labels: { chain: testnet }
    scrape_interval: 10s
    metrics_path: /metrics
    scheme: http

  - job_name: "node2"
    static_configs:
      - targets: ["node2:3002"]
        labels: { chain: testnet }
    scrape_interval: 10s
    metrics_path: /metrics
    scheme: http

  - job_name: "node3"
    static_configs:
      - targets: ["node3:3003"]
        labels: { chain: testnet }
    scrape_interval: 10s
    metrics_path: /metrics
    scheme: http

  # The mainnet validators. Compose project clutch-main, network clutch-mainnet, nothing published
  # to the host -- Prometheus reaches them because the stage overlay joins it to that network as an
  # external one. If these targets are DOWN while the containers run, that join is the first thing
  # to check.
  - job_name: "mainnet-node1"
    static_configs:
      - targets: ["mainnet-node1:3101"]
        labels: { chain: mainnet }
    scrape_interval: 10s
    metrics_path: /metrics
    scheme: http

  - job_name: "mainnet-node2"
    static_configs:
      - targets: ["mainnet-node2:3102"]
        labels: { chain: mainnet }
    scrape_interval: 10s
    metrics_path: /metrics
    scheme: http

  - job_name: "mainnet-node3"
    static_configs:
      - targets: ["mainnet-node3:3103"]
        labels: { chain: mainnet }
    scrape_interval: 10s
    metrics_path: /metrics
    scheme: http

  # The Hub APIs, one per chain. Neither was scraped until 2026-09-19, so nothing watched the
  # service every browser talks to: a hub that had crashed looked exactly like a hub that was
  # idle. `serve_metric_addr` is 0.0.0.0:9090 in each config -- the same number Prometheus
  # itself uses, which is fine because they are different containers on a shared network.
  #
  # mainnet-hub-api is reachable because it joins clutch-stage_clutch-network as well as
  # clutch-mainnet. If this target is down while its container runs, suspect that join.
  - job_name: "clutch-hub-api"
    scrape_interval: 30s
    static_configs:
      - targets: ["clutch-hub-api:9090"]
        labels: { chain: testnet }

  - job_name: "mainnet-hub-api"
    scrape_interval: 30s
    static_configs:
      - targets: ["mainnet-hub-api:9090"]
        labels: { chain: mainnet }

  # The treasury services. Both sit on clutch-network alongside Prometheus, and both serve metrics
  # on their own port rather than on their API: the orchestrator's API is public through nginx's
  # /payment/ route, and deposit counts are not public. Neither port is published in compose.
  #
  # Scraped every 30s rather than the nodes' 10s: these are database aggregates describing state
  # that changes on the order of minutes, not block-by-block counters.
  - job_name: "treasury-service"
    scrape_interval: 30s
    static_configs:
      - targets: ["treasury-service:9101"]

  - job_name: "payment-orchestrator"
    scrape_interval: 30s
    static_configs:
      - targets: ["payment-orchestrator:9102"]
