# Alerting rules for chain liveness.
#
# Written after the stage halt of 2026-09-14, which ran for most of a day and was reported by a
# human as "the explorer has no data". Ten rules already covered the money path and not one of
# them covered the chain underneath it, so the single most consequential fact a validator set can
# report — that it has stopped producing — was the one thing nothing evaluated.
#
# Aura gives a block every `60 / authorities` seconds, 20s on a three-node set, and authors an
# empty block when there is nothing to include. So height advancing is a heartbeat rather than a
# measure of traffic: a quiet chain still climbs, and a chain that stops climbing is broken.
#
# TWO CHAINS since 2026-09-19, and TWO ROLES. Every aggregation here is `by (chain)` AND
# scoped to `role="validator"`, and both halves are load-bearing.
#
# chain, because max() over both chains meant "stalled" needed BOTH to stall, and the
# height-spread rule compared a chain at 17,000 with one at 10 and would have fired for ever.
#
# role, because clutch-hub-api registers metrics with the SAME NAMES as the node --
# latest_block_index and latest_block -- and never sets them, so they read 0. Adding the hub
# as a scrape target with a chain label pulled those zeros into every chain aggregation:
# min() became 0, the spread became the full height, and ChainNodeBehind fired permanently
# on both chains. Caught within the hour on 2026-09-19 by the metrics probe printing
# max-min alongside max and the two matching exactly.
#
# A label rather than a job-name regex on purpose: a regex has to be remembered and widened
# every time a job is added, and the failure when it is not is this same silent one.
# over both chains meant "stalled" needed BOTH to stall, and the height-spread rule compared a
# chain at 17,000 with one at 10 and would have fired for ever.

groups:
  - name: chain-liveness
    interval: 30s
    rules:
      # The property the whole stack rests on. `max` over the nodes OF ONE CHAIN, because one node
      # stalling is a different, less urgent condition (ChainNodeBehind below) — this fires only
      # when NO node of that chain has advanced, which is the chain itself stopping.
      #
      # Five minutes is fifteen missed slots at 20s, far outside any plausible jitter, and the
      # `for` doubles it: about ten minutes to fire. The failure this exists for lasted a day.
      - alert: ChainHeightNotAdvancing
        expr: max by (chain) (delta(latest_block_index{role="validator"}[5m])) == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.chain }}: no node has produced a block in 5 minutes"
          description: >-
            The {{ $labels.chain }} chain has halted. Nothing downstream can be correct while this
            is firing: the explorer stops, the treasury reads a frozen supply and judges its
            reserve against it, and deposits credit against a chain that is not moving. Read the
            authoring error from EVERY node, not just the first — the slot owner holds the real
            reason and the others only report not being the author. The 2026-09-14 halt was a
            pooled transaction whose nonce the chain had already consumed: it joined every
            candidate block, failed validation, and could not be evicted by a restart, because
            only the import of a block carrying a transaction removes it from the pool.

      # node1 and node2 sat ~115,000 blocks behind while answering get_chain_info cheerfully, and
      # every service reading them believed a chain frozen near genesis. A node that is behind is
      # worse than one that is down: down is visible, behind answers.
      - alert: ChainNodeBehind
        expr: max by (chain) (latest_block_index{role="validator"}) - min by (chain) (latest_block_index{role="validator"}) > 50
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.chain }}: validators disagree on the height by more than 50 blocks"
          description: >-
            One {{ $labels.chain }} node is not keeping up. It will still answer RPC queries with
            its own stale height, so check what reads it before assuming the impact is limited to
            that container.

      - alert: ChainNodeDown
        expr: up{role="validator"} == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} ({{ $labels.chain }}) is not answering scrapes"
          description: >-
            With three authorities, one missing node loses a third of the slots and the chain
            still advances, more slowly. Two is a halt. For a mainnet-node, also check that
            Prometheus is still joined to the clutch-mainnet network: the nodes publish nothing to
            the host, so that join is the only path to them.

      # The hash-labelled series is what the explorer's indexer requires alongside the index; it
      # refuses the head and ingests nothing if either is missing. Absent means the node has not
      # published a block since boot.
      #
      # `absent()`, NOT `count(...) == 0`. The previous form never fired: an aggregation over an
      # empty vector returns an empty vector, not zero, so `== 0` compared nothing to zero and the
      # rule evaluated to nothing for as long as it existed. One rule per chain because absent()
      # cannot be split `by (chain)` -- there is nothing to group when the series is missing.
      - alert: ChainLatestBlockHashMissing
        expr: absent(latest_block{chain="testnet",role="validator"})
        for: 10m
        labels:
          severity: warning
          chain: testnet
        annotations:
          summary: "testnet: no node is publishing latest_block{block_hash}"
          description: >-
            The explorer's indexer reads both latest_block_index and latest_block{block_hash} and
            refuses the chain head unless it has both, so while this is firing the explorer shows
            nothing regardless of what the chain is doing.

      - alert: ChainLatestBlockHashMissing
        expr: absent(latest_block{chain="mainnet",role="validator"})
        for: 10m
        labels:
          severity: warning
          chain: mainnet
        annotations:
          summary: "mainnet: no node is publishing latest_block{block_hash}"
          description: >-
            No mainnet validator has published a head since boot, or Prometheus cannot reach them.
            Either way nothing reading this chain's head is seeing one.

  - name: hub-availability
    interval: 30s
    rules:
      # The service every browser talks to. Until 2026-09-19 nothing scraped either hub, so a
      # crashed one was indistinguishable from an idle one — and on mainnet that means the public
      # app at app.clutchprotocol.io is down with nothing saying so.
      #
      # Separate from ChainNodeDown deliberately. A node being down degrades the chain; a hub being
      # down takes the whole app off the air while the chain carries on perfectly, so the two want
      # different summaries even though the expression shape is the same.
      - alert: HubApiDown
        expr: up{role="hub"} == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} ({{ $labels.chain }}) is not answering scrapes"
          description: >-
            No client can reach this chain through GraphQL while this is firing. The chain itself
            is unaffected and will keep producing blocks, which is why nothing else here catches
            it. For mainnet-hub-api, check that it is still joined to BOTH clutch-mainnet and
            clutch-stage_clutch-network: it is the only service bridging them, and losing the
            second join breaks nginx's upstream while leaving the container healthy.
