# Grafana Datasource Provisioning Config
apiVersion: 1

datasources:
  - name: Prometheus
    # Pinned. Without it Grafana generates a uid on first provision, dashboards hard-code
    # whatever it happened to be, and a rebuilt Grafana silently orphans every panel.
    uid: PBFA97CFB590B2093
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
