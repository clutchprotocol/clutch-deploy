# The TESTNET block explorer (explorer-stage.clutchprotocol.io, chain_id 2077) and local dev,
# mounted at /app/config by clutch-explorer-backend and clutch-explorer-indexer in docker-compose.yml.
#
# The mainnet copy is config/explorer-mainnet/default.toml. Every value here is public: the database
# password comes from APP_DATABASE_URL in the compose file, the Seq key from APP_SEQ_API_KEY and the
# CORS list from APP_ALLOWED_ORIGINS.
log_level = "info"
listen_addr = "0.0.0.0:8088"

# node3, as the testnet Hub API and the treasury read it. The indexer takes the chain head from the
# metrics endpoint and fetches each block over the RPC, so these two must name the SAME node: read
# from two nodes, it can only ever index up to the slower one's height.
node_metrics_url = "http://node3:3003/metrics"
node_ws_url = "ws://node3:8083/ws"

# The testnet explorer rebuilds its index from the chain on every start: it truncates its tables on
# start and on shutdown. Harmless, because it holds only public chain data. Mainnet's are false.
developer_mode = true
cleanup_on_start = true

database_url = "postgres://postgres:postgres@clutch-explorer-postgres:5432/clutch_explorer"
indexer_poll_interval_ms = 4000
indexer_start_height = 0
seq_url = "http://seq:80"
seq_api_key = ""
allowed_origins = "*"

# The reserve section. Set by docker-compose.treasury.yml (APP_TREASURY_PUBLIC_RECONCILIATION_URL) to
# the testnet treasury. Empty here switches it off, which is what a stack without the treasury gets.
treasury_public_reconciliation_url = ""

# The testnet genesis (config/node/*.toml): 200 + 200 bps.
ride_request_referrer_fee_bps = 200
ride_offer_referrer_fee_bps = 200
