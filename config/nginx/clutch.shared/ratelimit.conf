# Apply the clutch_edge zone to every clutch vhost — IN DRY RUN.
#
# This file is the reason the limiting stays inside the clutch vhosts. The zone, the trusted-hop
# `geo` and the client-IP `map` are declared once at http level in clutch.http/ratelimit.conf,
# where they define variables and affect nobody who does not read them; this is what reads them,
# and it is copied into clutch server blocks only.
#
# `limit_req_dry_run on` means nginx evaluates the limit and logs what it WOULD have rejected,
# while serving the request normally. Nothing is refused today.
#
# That is deliberate and it is the whole rollout plan. A rate chosen from reasoning about "a page
# load is about twenty requests" is a guess, and the cost of guessing low is refusing real users at
# the edge, where they get a 429 with no application log explaining it. The measurement comes
# first; the enforcement flip is a separate, reviewable change that turns one line off.
#
# burst=20 nodelay: a browser opening the app fetches the document and its assets together, so a
# strict per-second gate would flag ordinary use. nodelay serves the burst immediately rather than
# queueing it — queueing would turn a limit into latency, which is worse than either serving or
# refusing.
limit_req zone=clutch_edge burst=20 nodelay;
limit_req_dry_run on;

# Only requests the limiter acted on, in a format carrying no client address. See
# clutch.http/ratelimit.conf for why this exists rather than the error log.
access_log /var/log/nginx/clutch-limit.log clutch_limit if=$clutch_limited;
