# Browser route to the payment orchestrator, which is deliberately not published on a host port.
#
# Byte-identical to the block this replaces, which was injected into the hand-maintained config by
# scripts/ensure-nginx-payment-route.sh until 2026-09-13. Verified against the live host before the
# move: no hand-tuning had accumulated, so this is a pure change of owner rather than a rewrite.
#
# proxy_pass names the service directly instead of declaring an upstream block: the file this lands
# in has no clutch upstreams, and one insertion point is one thing that can go wrong instead of two.
# The host resolves at config-load time either way, which is why the deploy reloads nginx after
# recreating containers.
location /payment/ {
    rewrite ^/payment(/api/.*)$ $1 break;
    proxy_pass http://payment-orchestrator:8091;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}
