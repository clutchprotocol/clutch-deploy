# MAINNET's own Seq (logs): mainnet-seq in docker-compose.mainnet.seq.yml, through the upstream in
# clutch.http/mainnet-upstreams.conf. The server block for this name is in the v2ray-docker file
# (MehranMazhar/v2ray-docker), like the other mainnet vhosts: this repo owns the locations only.
#
# Reading needs the Seq login (admin, MAINNET_SEQ_ADMIN_PASSWORD in .env.mainnet). Writing does not:
# Seq accepts log events with no API key. The mainnet services send theirs over the Docker networks,
# never through here, so the two ingestion endpoints are closed at the edge and nobody on the internet
# can add lines to the mainnet logs.

location /ingest/ {
    return 403;
}

location /api/events/raw {
    return 403;
}

location / {
    proxy_pass http://clutch_mainnet_seq/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
}
