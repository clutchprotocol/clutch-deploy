# The MAINNET block explorer: the React frontend at the root, its Rust API under /api/.
#
# The same routes as explorer-stage.clutchprotocol.io, pointed at the mainnet explorer's upstreams
# (clutch.http/mainnet-upstreams.conf), which docker-compose.mainnet.yml runs as
# mainnet-explorer-backend and mainnet-explorer-frontend. The server block for this name is in the
# v2ray-docker file (MehranMazhar/v2ray-docker), like the other mainnet vhosts: this repo owns the
# locations only.

location /api/ {
    proxy_pass http://clutch_mainnet_explorer_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}

location /health {
    proxy_pass http://clutch_mainnet_explorer_api/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}

location / {
    proxy_pass http://clutch_mainnet_explorer_web/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}
