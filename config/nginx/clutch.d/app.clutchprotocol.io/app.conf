# The demo app's own routes: the SPA at the root, and the same-origin paths it calls.
#
# Copied verbatim from the live host on 2026-09-13 (inspect-stage.yml, PROBE=nginx). These were
# written by hand over time, so the host was the only source of truth for them.
#
# Why the app has its own /api/, /graphql and /explorer/ rather than calling api-stage and
# explorer-stage directly: same origin. The browser reaches everything through this one hostname,
# which is also why /payment/ lives here (see payment.conf) rather than on a host port.
#
# `clutch_mainnet_api`, `clutch_mainnet_web`, `clutch_explorer_api` and `clutch_explorer_web` are upstream blocks
# defined OUTSIDE this file, in the hand-maintained config. This repo owns the locations, not the
# upstreams: an `upstream` block here would be a duplicate and nginx would refuse the whole config.
#
# `location /` proxies the demo app itself. It is the reason this vhost is the one to migrate last:
# everything else here degrades to one broken path, and this one is the whole site.

location /api/ {
    proxy_pass http://clutch_mainnet_api/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_cache_bypass $http_upgrade;
}
location /graphql {
    proxy_pass http://clutch_mainnet_api/graphql;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_cache_bypass $http_upgrade;
}
location /graphql/ws {
    proxy_pass http://clutch_mainnet_api/graphql/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 86400;
}
location /health {
    proxy_pass http://clutch_mainnet_api/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}
location / {
    proxy_pass http://clutch_mainnet_web/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}
# DELIBERATELY NOT PROXIED. clutch_explorer_api and clutch_explorer_web index the TESTNET
# chain (2077). Copied across unchanged, the mainnet app would show a block explorer full of
# another chain's blocks and balances, labelled as its own -- worse than no explorer,
# because it looks like it is working.
#
# 503 rather than simply absent: `location /` below is a catch-all that serves the SPA's
# index.html with a 200, so a missing route returns HTML where the caller expected JSON and
# fails with a parse error that names nothing.
#
# Restore both when a mainnet explorer exists, with its own indexer and its own database.
location /explorer/api/ {
    default_type application/json;
    return 503 '{"error":"the explorer is not available on mainnet yet"}';
}

location /explorer/ {
    return 503 "the explorer is not available on mainnet yet";
}
