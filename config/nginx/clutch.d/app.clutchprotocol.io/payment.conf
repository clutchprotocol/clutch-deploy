# Browser route to the MAINNET payment orchestrator, which is deliberately not published on a host port.
#
# `mainnet-payment-orchestrator` is a name no stage service has, so this cannot reach the testnet
# orchestrator. That orchestrator watches TRON **Nile**, whose USDT is worthless: a mainnet deposit
# panel pointed at it would show a real depositor an address watched by a service that can only see
# fake money, and credit them nothing. The deposit would be real, and gone. The stage copy of this file
# names `payment-orchestrator`; never copy that name here.
#
# WHO MAY USE IT. The orchestrator serves only the accounts in PILOT_ALLOWED_ADDRESSES (.env.mainnet):
# any other signed-in account gets 403, and is handed no deposit address and no redemption intent. This
# route is open to the internet; that list is the gate. "Mainnet — start the treasury" refuses to finish
# unless the orchestrator logged the allowlist as on, so do not point this at one that did not. See
# docs/ON-CALL.md, "Who may use mainnet", and readiness A2 and B4.
#
# Same shape as the stage route. proxy_pass names the service directly instead of declaring an
# upstream block: the file this lands in has no clutch upstreams. nginx resolves the name when it loads
# the config, so the orchestrator must be up and on the stage network first (nginx -t fails otherwise,
# and the deploy puts the previous config back).
location /payment/ {
    rewrite ^/payment(/api/.*)$ $1 break;
    proxy_pass http://mainnet-payment-orchestrator:8091;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}
