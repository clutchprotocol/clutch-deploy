# DELIBERATELY NOT PROXIED. There is no mainnet payment-orchestrator.
#
# The stage vhost's copy of this file proxies /payment/ to payment-orchestrator:8091 -- the service
# that watches TRON **Nile**, a test network whose USDT is worthless. Copied across unchanged, the
# mainnet deposit panel would show a real depositor an address watched by a service that can only
# see fake money, and credit them nothing. The deposit would be real, and gone.
#
# 503 rather than absent, for the same reason as the explorer routes: `location /` is a catch-all
# that answers 200 with index.html, so the panel would fail on unparseable HTML instead of on a
# status code that says what happened.
#
# Replace this with a proxy_pass when a mainnet orchestrator exists, pointed at TRON mainnet with a
# funded payout float. Until then, failing loudly is the feature.
location /payment/ {
    default_type application/json;
    return 503 '{"error":"deposits are not enabled on mainnet yet"}';
}
