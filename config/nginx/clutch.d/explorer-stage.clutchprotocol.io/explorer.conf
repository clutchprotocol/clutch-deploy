# Block explorer: the React frontend at the root, its Rust API under /api/.
#
# Copied verbatim from the live host on 2026-09-13 (inspect-stage.yml, PROBE=nginx). Written by
# hand over time, so the host was the only source of truth for them.
#
# `clutch_explorer_api` and `clutch_explorer_web` are upstream blocks defined OUTSIDE this file, in
# the hand-maintained config. This repo owns the locations, not the upstreams: an `upstream` block
# here would be a duplicate and nginx would refuse the whole config.

location /api/ {
    proxy_pass http://clutch_explorer_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}

location /health {
    proxy_pass http://clutch_explorer_api/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}

location / {
    proxy_pass http://clutch_explorer_web/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}
