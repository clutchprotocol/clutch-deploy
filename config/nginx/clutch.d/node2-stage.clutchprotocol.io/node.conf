# Validator node 2: the WebSocket JSON-RPC endpoint and the Prometheus scrape target.
#
# Copied verbatim from the live host on 2026-09-13 (inspect-stage.yml, PROBE=nginx). The three node
# vhosts differ only in hostname, upstream and ports, and each was read separately rather than
# derived from node1 -- "presumably identical" is how a hand-maintained difference gets erased.
#
# proxy_read_timeout 86400 on /ws is what stops nginx cutting an idle subscription at its 60s
# default, and the Upgrade/Connection pair is what makes the handshake a 101 rather than a plain
# 200. Lose either and the page still loads while nothing ever streams.
#
# `location /` returns 404 deliberately: these hosts expose two endpoints and nothing else.

location /ws {
    proxy_pass http://node2:8082;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 86400;
}

location /metrics {
    proxy_pass http://node2:3002/metrics;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}

location / {
    return 404;
}
