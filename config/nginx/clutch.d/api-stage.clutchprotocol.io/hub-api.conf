# Hub API routes for api-stage.clutchprotocol.io.
#
# Copied verbatim from the live host on 2026-09-13 (inspect-stage.yml, PROBE=nginx with
# VHOST=api-stage.clutchprotocol.io). These were written by hand over time and this repo has never
# been the source of truth for them, so the live text is the only thing worth copying -- not what
# the repo or anyone's memory says they should be.
#
# `clutch_api` is an upstream block defined OUTSIDE this file, in the hand-maintained config. This
# repo owns the locations, not the upstream: an `upstream` block here would be a duplicate and
# nginx would refuse the whole config. That the upstream is still unowned is a real remainder of
# readiness item G1, not an oversight.
#
# The `add_header` directives in this server block sit outside any location and stay where they
# are. The takeover replaces locations and nothing else.

location /graphql {
    proxy_pass http://clutch_api/graphql;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_cache_bypass $http_upgrade;
}

# The subscription endpoint. proxy_read_timeout 86400 is what keeps an idle subscription from being
# cut at nginx's 60s default, and the Upgrade/Connection pair is what makes the handshake a 101
# rather than a plain 200. Lose either and every page still loads while no subscription ever fires,
# which is why the deploy gate gets a real WebSocket handshake rather than a status code.
location /graphql/ws {
    proxy_pass http://clutch_api/graphql/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 86400;
}

location /health {
    proxy_pass http://clutch_api/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}

location / {
    proxy_pass http://clutch_api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}
