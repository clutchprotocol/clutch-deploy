# Per-client request limiting for the clutch vhosts: who the client is, and how many.
#
# Readiness item E1's open half. Source limiting belongs at the edge, "where the hop is actually
# known" — but at nginx the hop is Cloudflare, not the client, so a naive $binary_remote_addr key
# would put every visitor on the planet in one bucket keyed on a Cloudflare edge address.
#
# WHY THIS IS SAFE, AND WHY THE SAME IDEA WAS REJECTED INSIDE THE HUB API
#
# `geo` matches on the actual peer address. So $clutch_cf_trusted is 1 only when the request really
# arrived from Cloudflare, and the map below honours CF-Connecting-IP only in that case. A request
# hitting the origin directly with a forged header is not from one of these ranges, so its header is
# ignored and the key falls back to the peer. That is the difference between trusting a header and
# trusting a header from a known hop — the app has no way to draw that line, and this does.
#
# NOT `set_real_ip_from`, which would have done the same job by rewriting $remote_addr. That
# directive is only legal at http, server or location level: at http it changes $remote_addr for
# v2ray's vhosts too, and per-server it means these twenty-two ranges copied into six server blocks,
# which is how one of the six silently falls behind. `geo` and `map` only DEFINE variables —
# nothing that does not read them is affected, so this sits at http level and still touches nothing
# outside the clutch vhosts.
#
# Ranges from cloudflare.com/ips-v4 and ips-v6, fetched 2026-09-14. THEY DO CHANGE. A stale list
# fails in the safe direction — an unlisted Cloudflare address means its clients share one bucket,
# so they are limited too hard rather than not at all — but it wants refreshing when Cloudflare
# publishes changes.
geo $clutch_cf_trusted {
    default 0;
    173.245.48.0/20 1;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22 1;
    141.101.64.0/18 1;
    108.162.192.0/18 1;
    190.93.240.0/20 1;
    188.114.96.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    162.158.0.0/15 1;
    104.16.0.0/13 1;
    104.24.0.0/14 1;
    172.64.0.0/13 1;
    131.0.72.0/22 1;
    2400:cb00::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2405:b500::/32 1;
    2405:8100::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;
}

# The trusted flag and the header together, so a trusted hop that sent no header still falls back to
# the peer rather than keying every such request on the empty string.
map "$clutch_cf_trusted:$http_cf_connecting_ip" $clutch_client_ip {
    default    $remote_addr;
    "~^1:(.+)" $1;
}

# 10m of zone state holds on the order of 160,000 clients. rate=10r/s is 600 a minute each: far
# above a person using the app, far below a flood. Deliberately generous for a first measurement
# rather than tuned — see the dry run in clutch.shared/ratelimit.conf.
limit_req_zone $clutch_client_ip zone=clutch_edge:10m rate=10r/s;

# 429, not nginx's default 503. A 503 says "the server is having trouble", which is untrue and also
# tells a client to retry; 429 says what actually happened, and is what the orchestrator's own
# per-identity limiter already returns.
limit_req_status 429;
