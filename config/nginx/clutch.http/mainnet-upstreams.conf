# Mainnet app upstreams, injected at the top of the http block.
#
# Resolved by container name, which works because docker-compose.mainnet.yml joins these two
# services to clutch-stage_clutch-network — the network nginx already sits on. The VALIDATORS are
# deliberately absent from this file: they serve WebSocket JSON-RPC on 8181-8183 and publish
# nothing to the host, and putting a mainnet node's RPC on the public edge is a decision to make
# on purpose, with its own rate limits, rather than a side effect of publishing the app.
#
# nginx resolves an upstream's hostname when it LOADS the config, so both containers must already
# be running before this file lands. If they are not, `nginx -t` fails with "host not found in
# upstream" and the deploy restores the previous config — which is why this change comes after
# mainnet-app-up.yml and not with it.
upstream clutch_mainnet_api {
    server mainnet-hub-api:3000;
}
upstream clutch_mainnet_web {
    server mainnet-demo-app:80;
}
