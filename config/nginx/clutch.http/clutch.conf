# The upstreams every clutch route resolves to.
#
# Copied verbatim from the live host on 2026-09-13 (inspect-stage.yml, PROBE=nginx). G1 moved every
# clutch `location` into this repo and left these behind, because a route file cannot declare an
# upstream: `location` blocks land inside a server, `upstream` blocks belong to `http`, and a
# duplicate of either makes nginx refuse the whole config. So they get their own managed block at
# http level.
#
# These names are referenced from config/nginx/clutch.d/*/ -- renaming one here without changing
# every route that names it produces a config nginx rejects at load, which is the loud failure
# rather than the quiet one.
#
# Single-server upstreams: this is one host running one container each. They exist so the routes
# have a name to point at rather than for load balancing, which is also why adding `keepalive` or a
# second server here is a real change rather than a tidy-up.

upstream clutch_api {
    server clutch-hub-api:3000;
}

upstream clutch_web {
    server clutch-hub-demo-app:80;
}

upstream clutch_explorer_api {
    server clutch-explorer-backend:8088;
}

upstream clutch_explorer_web {
    server clutch-explorer-frontend:80;
}
