# Treasury stack: the mint authority and the public payment orchestrator.
#
# Kept as its own overlay rather than folded into docker-compose.yml so the base stack still
# comes up for anyone not running the reserve side, and so local vs stage can opt in per
# environment. Compose it after the base file:
#
#   docker compose -p clutch-dev -f docker-compose.yml -f docker-compose.dev.yml \
#                                -f docker-compose.treasury.yml up -d
#
# NETWORK POSTURE — the point of this file, and the thing not to "simplify" later:
#
#   treasury-service      PRIVATE. Holds the chain mint key. NO published ports, ever. Reachable
#                         only from other containers. It joins clutch-network solely to read
#                         node1's WebSocket RPC.
#   payment-orchestrator  PUBLIC. Holds no chain keys and no spending keys — only the deposit
#                         wallet's xpub, which can derive receive addresses and nothing else.
#                         Published on 8091 because real users reach it. Joins treasury-network
#                         as well so it can call the treasury's internal API.
#   tron-signer           PRIVATE, and the most sensitive service here: it holds the deposit
#                         MNEMONIC and can spend every derived address. No published ports. Its
#                         protection is the API shape as much as the network — /internal/sweep
#                         takes an index and the destination is its own config, so reaching it
#                         does not let anyone choose where funds go.
#   treasury-network      internal: true — containers on it cannot reach, or be reached from,
#                         the outside world except via another network they also sit on. This is
#                         what keeps both Postgres instances unreachable from the host.
#
# Two databases, not one: the services own separate schemas and separate migration histories
# (sqlx's _sqlx_migrations table has no configurable name, so sharing one database corrupts
# both migrators). This mirrors what the test rig already does per-crate.
#
# Every secret comes from .env. Nothing sensitive is defaulted inline — the one exception is
# noted at APP_MINT_AUTHORITY_SECRET below, and it is a hard failure by design.
services:
  treasury-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: treasury
      POSTGRES_USER: treasury
      POSTGRES_PASSWORD: ${TREASURY_POSTGRES_PASSWORD:?set TREASURY_POSTGRES_PASSWORD in .env}
    volumes:
      - treasury-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U treasury"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - treasury-network

  orchestrator-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: orchestrator
      POSTGRES_USER: orchestrator
      POSTGRES_PASSWORD: ${ORCHESTRATOR_POSTGRES_PASSWORD:?set ORCHESTRATOR_POSTGRES_PASSWORD in .env}
    volumes:
      - orchestrator-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orchestrator"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - treasury-network

  # PRIVATE ZONE. Deliberately has no `ports:` — adding one exposes the mint authority.
  treasury-service:
    image: ghcr.io/clutchprotocol/clutch-treasury:latest
    depends_on:
      treasury-postgres:
        condition: service_healthy
    environment:
      - RUST_LOG=${TREASURY_LOG_LEVEL:-info}
      - APP_DATABASE_URL=postgres://treasury:${TREASURY_POSTGRES_PASSWORD}@treasury-postgres:5432/treasury
      # Pointed at node3. node1 is the p2p bootstrap and fell ~115,000 blocks behind; node2 then
      # turned out to be stuck near height 100 as well. Both answer get_chain_info cheerfully with
      # a stale height, so every service reading them saw a chain frozen near genesis while the
      # real one was past 117,000. node3 is the only node currently holding the full chain.
      # Being the bootstrap is a p2p role and says nothing about which node is best to read.
      - APP_NODE_WS_URL=ws://node3:8083/ws
      # Peers for the staleness guard: heights are compared across these and this service
      # refuses to mint or judge when its primary is behind the highest. Reading one node and
      # trusting it is what let a 115,000-block lag go unnoticed for a full day.
      - APP_NODE_PEER_WS_URLS=ws://node1:8081/ws,ws://node2:8082/ws
      - APP_CHAIN_ID=${CHAIN_ID:-2077}
      # No default: the node refuses to mint without the authority key, and a placeholder here
      # would turn "misconfigured" into "silently signing with the wrong key".
      - APP_MINT_AUTHORITY_SECRET=${MINT_AUTHORITY_SECRET:?set MINT_AUTHORITY_SECRET in .env}
      - APP_INITIATOR_TOKEN=${TREASURY_INITIATOR_TOKEN:?set TREASURY_INITIATOR_TOKEN in .env}
      - APP_APPROVER_TOKEN=${TREASURY_APPROVER_TOKEN:?set TREASURY_APPROVER_TOKEN in .env}
      - APP_READONLY_TOKEN=${TREASURY_READONLY_TOKEN:?set TREASURY_READONLY_TOKEN in .env}
      # TronGrid: read-only deposit verification. Without a key TronGrid still answers, but
      # rate-limits hard — fine for local, set one for stage.
      - APP_TRONGRID_URL=${TRONGRID_URL:-https://nile.trongrid.io}
      - APP_TRONGRID_API_KEY=${TRONGRID_API_KEY:-}
      - APP_CUSTODY_TRON_ADDRESS=${CUSTODY_TRON_ADDRESS:-}
      # MUST match the network APP_TRONGRID_URL points at. The crate's default is the MAINNET
      # USDT contract; this default is a testnet one, because a local/stage stack has no business
      # verifying against mainnet.
      #
      # NILE testnet USDT — the token the official Nile faucet (nileex.io) actually dispenses.
      #
      # This was TXLAQ63Xg1NAzckPwKHvzw7CSEmLMEqcdj, chosen because it exists on Nile and reports
      # symbol "USDT". Both true, and both useless: Nile carries at least two tokens claiming that
      # symbol, and the faucet hands out the OTHER one. Nobody could obtain the configured token,
      # which made the entire stage deposit flow untestable by construction.
      #
      # It would also have failed silently rather than loudly. tron_verifier queries TronGrid with
      # `contract_address=<this>`, so a transfer of any other token is not a mismatch — it is
      # absent from the response. The intent finds no evidence, stays Transient, and ages into
      # manual review with nothing naming the cause.
      #
      # This one is also the faithful mainnet analogue: contract name `TetherToken`, matching
      # mainnet USDT (TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t). The old one was named plain `USDT`.
      # Both are 6 decimals, so no micro-unit maths changes.
      #
      # Bitcart's TRX daemon decides independently what it watches — the orchestrator never sends
      # a contract, only a price — so if deposits are detected but never verify, check that side
      # too before assuming this value is wrong.
      - APP_USDT_CONTRACT=${USDT_CONTRACT:-TXYZopYRdj2D9XRtbG411XZZ3kM5VkAeBf}
      # Sweeps: this service decides WHEN, tron-signer knows HOW and owns the keys.
      - APP_SIGNER_URL=http://tron-signer:8093
      - APP_SIGNER_TOKEN=${SIGNER_TOKEN:?set SIGNER_TOKEN in .env}
      # Threshold, because a sweep costs TRX for energy and per-deposit sweeping can exceed what it
      # moves at the $1 minimum. The max age stops sub-threshold balances sitting forever and
      # fragmenting the reserve across addresses nobody revisits.
      # Mint caps, surfaced with TODAY'S values as the defaults -- this changes nothing on its own.
      #
      # They were reachable only by editing default.toml and rebuilding the image, which is a poor
      # place for a spending limit: the $990 correction for an overpaid deposit was refused by the
      # per-transaction cap ("amount 990000000 exceeds per-transaction cap 50000000 — escalate to
      # multisig"), and the only ways out were a code change or splitting the payment to get under
      # the limit. Now it is one line in .env.
      #
      # These are pilot figures: $50 per transaction, $500 per day. Note they now gate ORDINARY
      # deposits too, not just manual corrections -- overpayments credit what actually arrived, so
      # any deposit over the per-transaction cap parks for a human. Worth choosing deliberately
      # rather than inheriting.
      - APP_PER_TX_MINT_CAP_CLT=${PER_TX_MINT_CAP_CLT:-50000000}
      - APP_DAILY_MINT_CAP_CLT=${DAILY_MINT_CAP_CLT:-500000000}
      - APP_SWEEP_THRESHOLD_USDT=${SWEEP_THRESHOLD_USDT:-100000000}
      - APP_SWEEP_MAX_AGE_HOURS=${SWEEP_MAX_AGE_HOURS:-168}
    restart: unless-stopped
    networks:
      - treasury-network   # its own Postgres
      - clutch-network     # node1's WebSocket RPC only

  # PRIVATE ZONE, and the most sensitive thing in the stack: this holds the deposit-wallet
  # MNEMONIC, which can spend every derived deposit address.
  #
  # No `ports:`, ever. Reachable only from treasury-service over treasury-network.
  #
  # It sits on clutch-network too, and that is not an oversight: building and broadcasting a sweep
  # needs TronGrid, and `internal: true` means no outbound route at all. Same posture as
  # treasury-service, which holds the chain mint key under the identical trade-off — unpublished,
  # but not air-gapped, because it has work to do on the internet.
  #
  # What keeps that acceptable is the API shape rather than the network: /internal/sweep takes an
  # INDEX and nothing else, and the destination comes from APP_TREASURY_ADDRESS below. Reaching this
  # service does not let anyone choose where funds go.
  tron-signer:
    image: ghcr.io/clutchprotocol/clutch-tron-signer:latest
    environment:
      - RUST_LOG=${SIGNER_LOG_LEVEL:-info}
      # No default and no TOML fallback. A placeholder here would be a valid but DIFFERENT wallet,
      # and the first symptom is deposits arriving at addresses nothing can sweep.
      - APP_DEPOSIT_MNEMONIC=${DEPOSIT_MNEMONIC:?set DEPOSIT_MNEMONIC in .env}
      - APP_DEPOSIT_PASSPHRASE=${DEPOSIT_PASSPHRASE:-}
      - APP_SIGNER_TOKEN=${SIGNER_TOKEN:?set SIGNER_TOKEN in .env}
      # Where every sweep goes. NOT a request parameter — this line is the reason a compromised
      # caller cannot redirect funds.
      - APP_TREASURY_ADDRESS=${CUSTODY_TRON_ADDRESS:?set CUSTODY_TRON_ADDRESS in .env}
      - APP_TRONGRID_URL=${TRONGRID_URL:-https://nile.trongrid.io}
      - APP_TRONGRID_API_KEY=${TRONGRID_API_KEY:-}
      - APP_USDT_CONTRACT=${USDT_CONTRACT:-TXYZopYRdj2D9XRtbG411XZZ3kM5VkAeBf}
      # The most one redemption payout may move, in MICRO-USDT. The signer refuses to start without
      # it and refuses a non-positive value: a payout cap that silently defaults is a cap nobody
      # chose, and a zero one would refuse every payout while looking like a working service.
      #
      # NOT the same number as the treasury's future APP_DAILY_PAYOUT_CAP_CLT, which is a rolling
      # 24h total in CLT base units. They are equal at 1:1 par and must still be set separately —
      # deriving one from the other couples two different units.
      #
      # 25 USDT default: the payout float is deliberately small, and this bounds a single request
      # against it. Raise it deliberately, not to make a failing payout succeed.
      - APP_PER_TX_PAYOUT_CAP_USDT=${PER_TX_PAYOUT_CAP_USDT:-25000000}
      - APP_HTTP_ADDR=0.0.0.0:8093
    restart: unless-stopped
    networks:
      - treasury-network   # treasury-service reaches it here
      - clutch-network     # TronGrid egress only

  # PUBLIC ZONE. Holds no chain keys; the worst a compromise here can do is create intents the
  # treasury's verifier and breakers still have to agree to.
  payment-orchestrator:
    image: ghcr.io/clutchprotocol/clutch-orchestrator:latest
    depends_on:
      orchestrator-postgres:
        condition: service_healthy
    ports:
      - "8091:8091"
    environment:
      - RUST_LOG=${ORCHESTRATOR_LOG_LEVEL:-info}
      - APP_DATABASE_URL=postgres://orchestrator:${ORCHESTRATOR_POSTGRES_PASSWORD}@orchestrator-postgres:5432/orchestrator
      # Same secret the hub API signs user JWTs with — the orchestrator authenticates end users
      # by verifying those, so a mismatch rejects every real request.
      - APP_JWT_SECRET=${JWT_SECRET:-b93ee84f5c75b27cdcaa1ddbb2bd74bbf9b3ed7d2b1effb06ab0a71b61467caf}
      # Same ALLOWED_ORIGINS the hub API CORS-allows — both are called from the same demo-app
      # origin, and on stage the browser never reaches this service directly anyway (nginx's
      # /payment/ route proxies it same-origin); this only bites local dev, where the demo app
      # calls localhost:8091 cross-origin.
      - APP_ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
      - APP_TREASURY_URL=http://treasury-service:8090
      - APP_TREASURY_INITIATOR_TOKEN=${TREASURY_INITIATOR_TOKEN:?set TREASURY_INITIATOR_TOKEN in .env}
      - APP_TREASURY_READONLY_TOKEN=${TREASURY_READONLY_TOKEN:?set TREASURY_READONLY_TOKEN in .env}
      # NOT where users pay -- each intent gets its own derived address now. This is the sweep
      # destination, where the signer consolidates deposits after they are credited.
      - APP_CUSTODY_TRON_ADDRESS=${CUSTODY_TRON_ADDRESS:-}
      # The wallet this service derives deposit addresses from. PUBLIC material by design: an
      # account-level xpub can derive receive addresses and nothing else, so a full compromise of
      # this container yields no ability to spend. The matching mnemonic lives only in tron-signer.
      #
      # Hard-fails rather than defaulting. There is no safe default -- a placeholder would derive
      # addresses from a wallet nobody holds the keys to, and every deposit paid into one would be
      # unrecoverable. Read the value off the signer's /internal/xpub so it cannot be mistyped.
      - APP_DEPOSIT_ACCOUNT_XPUB=${DEPOSIT_ACCOUNT_XPUB:?set DEPOSIT_ACCOUNT_XPUB in .env}
      # This service watches the derived addresses itself (custody.rs), matching USDT transfers by
      # DESTINATION. Must name the same network the contract lives on, or every deposit goes
      # unmatched forever.
      - APP_TRONGRID_URL=${TRONGRID_URL:-https://nile.trongrid.io}
      # Unkeyed TronGrid throttles hard, and a throttled watcher looks exactly like "nobody paid".
      - APP_TRONGRID_API_KEY=${TRONGRID_API_KEY:-}
      - APP_USDT_CONTRACT=${USDT_CONTRACT:-TXYZopYRdj2D9XRtbG411XZZ3kM5VkAeBf}
      # OFF. The treasury's payout rail is still a stub (payout.rs fabricates a payout_ref and
      # sends nothing). Spec §7.6 wants a working off-ramp before real deposits; enabling this
      # invites users to burn real CLT for a payout that cannot happen, and the burn is
      # irreversible. Do not flip until a real TRC-20 payout rail replaces the stub.
      - APP_REDEMPTIONS_ENABLED=false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8091/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - treasury-network   # reach the treasury's internal API
      - clutch-network     # reachable by users, Bitcart, nginx

networks:
  treasury-network:
    driver: bridge
    # No route off this network. Both Postgres instances live here and nowhere else.
    internal: true

volumes:
  treasury-postgres-data:
    driver: local
  orchestrator-postgres-data:
    driver: local
