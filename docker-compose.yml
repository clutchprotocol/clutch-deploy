# Clutch Protocol - Full Stack Deployment
# Node + API + Monitoring
# Uses pre-built images from GHCR / Docker Hub
#
# Every image is pinned to an exact tag, never `latest`: a deploy ships what this file says and
# nothing newer. Clutch images move with scripts/set-image.sh (the deploy workflow calls it for a
# new build); the monitoring images move by a reviewed edit here. scripts/test-set-image.sh fails
# any PR that brings `latest` back.

services:
  # Clutch blockchain nodes
  node1:
    image: ghcr.io/clutchprotocol/clutch-node:sha-aa4159f
    stop_grace_period: 30s
    # DB_PATH keeps RocksDB on the volume below. Without it the node writes to its working
    # directory — the container's WRITABLE LAYER — and `up -d --force-recreate`, which every
    # deploy runs, discarded the whole chain. Stage restarted from genesis on every deploy.
    environment:
      - APP_SEQ_API_KEY=${SEQ_API_KEY:-}
      - DB_PATH=/app/data
    networks:
      - clutch-network
    ports:
      - "8081:8081"
      - "4001:4001"
      - "3001:3001"
    volumes:
      - ./config:/app/config:ro
      # One volume per node: each has its own blockchain_name/DB and they must not share state.
      - node1-data:/app/data
    command: ["--env", "node1"]
    restart: unless-stopped

  node2:
    image: ghcr.io/clutchprotocol/clutch-node:sha-aa4159f
    stop_grace_period: 30s
    # DB_PATH keeps RocksDB on the volume below. Without it the node writes to its working
    # directory — the container's WRITABLE LAYER — and `up -d --force-recreate`, which every
    # deploy runs, discarded the whole chain. Stage restarted from genesis on every deploy.
    environment:
      - APP_SEQ_API_KEY=${SEQ_API_KEY:-}
      - DB_PATH=/app/data
    depends_on:
      - node1
    networks:
      - clutch-network
    ports:
      - "8082:8082"
      - "4002:4002"
      - "3002:3002"
    volumes:
      - ./config:/app/config:ro
      # One volume per node: each has its own blockchain_name/DB and they must not share state.
      - node2-data:/app/data
    command: ["--env", "node2"]
    restart: unless-stopped

  node3:
    image: ghcr.io/clutchprotocol/clutch-node:sha-aa4159f
    stop_grace_period: 30s
    # DB_PATH keeps RocksDB on the volume below. Without it the node writes to its working
    # directory — the container's WRITABLE LAYER — and `up -d --force-recreate`, which every
    # deploy runs, discarded the whole chain. Stage restarted from genesis on every deploy.
    environment:
      - APP_SEQ_API_KEY=${SEQ_API_KEY:-}
      - DB_PATH=/app/data
    depends_on:
      - node1
    networks:
      - clutch-network
    ports:
      - "8083:8083"
      - "4003:4003"
      - "3003:3003"
    volumes:
      - ./config:/app/config:ro
      # One volume per node: each has its own blockchain_name/DB and they must not share state.
      - node3-data:/app/data
    command: ["--env", "node3"]
    restart: unless-stopped

  # Clutch Hub API (bridges apps to node)
  clutch-hub-api:
    image: ghcr.io/clutchprotocol/clutch-hub-api:sha-b28b37b
    depends_on:
      - node1
      - seq
    ports:
      - "3000:3000"
    # Everything else, the node it reads included, is in config/api/default.toml. The hub reads
    # APP_* variables only, and it gets only these: no `env_file`, which handed it the whole .env.testnet,
    # the treasury's secrets included.
    environment:
      - APP_SEQ_API_KEY=${SEQ_API_KEY:-}
      - APP_ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
      - "APP_JWT_SECRET=${JWT_SECRET:?not set - it signs the tokens the hub API issues and the orchestrator trusts, so there is no safe default. Run provision-treasury-secrets.yml}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - clutch-network
    volumes:
      - ./config/api:/app/config:ro

  # Prometheus - metrics collection
  prometheus:
    image: prom/prometheus:v3.15.0
    networks:
      - clutch-network
    ports:
      - "9090:9090"
    volumes:
      - prometheus-data:/prometheus
      - ./config/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # The rules DIRECTORY, not a file. prometheus.yml globs /etc/prometheus/rules/*.yml, and a
      # glob that matches nothing is not an error — so without this mount Prometheus starts
      # cleanly, reports no rules, and every alert in config/monitoring/prometheus/rules/ silently
      # does not exist. That is the same shape as the nginx config this repo already learned from.
      - ./config/monitoring/prometheus/rules:/etc/prometheus/rules:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--storage.tsdb.retention.time=200h"
      - "--web.enable-lifecycle"
    restart: unless-stopped

  # Delivers what Prometheus evaluates. Readiness items D3 and D4.
  #
  # Nothing depends on this and it depends on nothing: a monitoring container must never be able to
  # take the money stack with it, and an unconfigured destination must never look like an outage.
  # Unreachable, alerts pile up in Prometheus exactly as they did before it existed.
  #
  # Neither Telegram value is in the image or in git. deploy-stage.sh renders alertmanager.yml from
  # the committed .tpl (substituting the chat id) and writes the bot token to its own file, both
  # from the host's .env.testnet. Routing stays reviewable in git; the credentials stay in .env.testnet.
  alertmanager:
    image: prom/alertmanager:v0.27.0
    networks:
      - clutch-network
    ports:
      - "9093:9093"
    volumes:
      - alertmanager-data:/alertmanager
      - ./config/monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./config/monitoring/alertmanager/telegram-token:/etc/alertmanager/telegram-token:ro
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    restart: unless-stopped

  # Grafana - dashboards 
  grafana:
    image: grafana/grafana:13.2.2
    depends_on:
      - prometheus
    networks:
      - clutch-network
    ports:
      - "3030:3030"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/monitoring/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./config/monitoring/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./config/monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards/clutch:ro
    environment:
      - GF_SERVER_HTTP_PORT=3030
      # Was hardcoded 'admin'. Committed value is a fallback only — override with
      # GRAFANA_ADMIN_PASSWORD in .env.testnet per environment. Grafana re-applies this to the
      # admin user on every restart, so a redeploy rotates it.
      - "GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?not set. Run provision-treasury-secrets.yml}"
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    restart: unless-stopped

  # Seq - structured logging
  seq:
    image: datalust/seq:2026.1.17182
    networks:
      - clutch-network
    ports:
      - "5341:80"
    volumes:
      - seq-data:/data
    environment:
      - ACCEPT_EULA=Y
      # Enable authentication on first run (requires empty/new /data volume)
      - SEQ_FIRSTRUN_ADMINUSERNAME=${SEQ_ADMIN_USERNAME:-admin}
      - SEQ_FIRSTRUN_ADMINPASSWORD=${SEQ_ADMIN_PASSWORD:-}
    restart: unless-stopped

  # Demo app (React + map-based ride request)
  clutch-hub-demo-app:
    image: ghcr.io/clutchprotocol/clutch-hub-demo-app:sha-84ad5f0
    ports:
      - "5173:80"
    depends_on:
      - clutch-hub-api
    networks:
      - clutch-network
    restart: unless-stopped

  clutch-explorer-backend:
    image: ghcr.io/clutchprotocol/clutch-explorer-backend:sha-52f5de4
    stop_grace_period: 30s
    depends_on:
      - node1
      - seq
      - clutch-explorer-postgres
      - clutch-explorer-indexer
    ports:
      - "8088:8088"
    # Only what is secret or set per host; the rest is config/explorer/default.toml, which the
    # indexer below reads too. No `env_file`: it handed the explorer the whole .env.testnet.
    environment:
      - APP_DATABASE_URL=postgres://${EXPLORER_POSTGRES_USER:-postgres}:${EXPLORER_POSTGRES_PASSWORD:-postgres}@clutch-explorer-postgres:5432/${EXPLORER_POSTGRES_DB:-clutch_explorer}
      - APP_SEQ_API_KEY=${SEQ_API_KEY:-}
      - APP_ALLOWED_ORIGINS=${EXPLORER_ALLOWED_ORIGINS:-*}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8088/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - clutch-network
    volumes:
      - ./config/explorer:/app/config:ro

  clutch-explorer-indexer:
    image: ghcr.io/clutchprotocol/clutch-explorer-backend:sha-52f5de4
    stop_grace_period: 30s
    depends_on:
      - node1
      - seq
      - clutch-explorer-postgres
    command: ["/usr/local/bin/indexer", "--env", "default"]
    # The node it reads (node3, the same for head and blocks) and its poll settings are in
    # config/explorer/default.toml. No `env_file`: it handed the indexer the whole .env.testnet.
    environment:
      - APP_DATABASE_URL=postgres://${EXPLORER_POSTGRES_USER:-postgres}:${EXPLORER_POSTGRES_PASSWORD:-postgres}@clutch-explorer-postgres:5432/${EXPLORER_POSTGRES_DB:-clutch_explorer}
      - APP_SEQ_API_KEY=${SEQ_API_KEY:-}
    restart: unless-stopped
    # This service shares the backend's IMAGE but not its entrypoint, and the image's HEALTHCHECK
    # curls /health on 8088 — which the indexer binary does not serve. So it reported `unhealthy`
    # from its first probe onward, permanently, whether it was working or not. A status that is
    # always red is worse than no status: it trains everyone to ignore the one column that would
    # have shown this container had stopped ingesting. Indexer liveness is the "chain height not
    # advancing" Prometheus alert instead.
    healthcheck:
      disable: true
    networks:
      - clutch-network
    volumes:
      - ./config/explorer:/app/config:ro

  clutch-explorer-postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=${EXPLORER_POSTGRES_DB:-clutch_explorer}
      - POSTGRES_USER=${EXPLORER_POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${EXPLORER_POSTGRES_PASSWORD:-postgres}
    volumes:
      - clutch-explorer-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${EXPLORER_POSTGRES_USER:-postgres} -d ${EXPLORER_POSTGRES_DB:-clutch_explorer}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - clutch-network

  clutch-explorer-frontend:
    image: ghcr.io/clutchprotocol/clutch-explorer-frontend:sha-52f5de4
    ports:
      - "5174:80"
    depends_on:
      - clutch-explorer-backend
    networks:
      - clutch-network
    restart: unless-stopped

networks:
  clutch-network:
    driver: bridge

volumes:
  # Chain state. `down -v` wipes these, which is what clutch-deploy's reset_chain flag is for —
  # and now actually means something, since a plain deploy no longer resets the chain.
  node1-data:
    driver: local
  node2-data:
    driver: local
  node3-data:
    driver: local
  seq-data:
    driver: local
  grafana-data:
    driver: local
  prometheus-data:
    driver: local
  # Silences and the notification log, so a restart does not re-send every firing alert.
  alertmanager-data:
    driver: local
  clutch-explorer-postgres-data:
    driver: local
