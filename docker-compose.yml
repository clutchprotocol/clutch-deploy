# Clutch Protocol - Full Stack Deployment
# Node + API + Monitoring
# Uses pre-built images from GHCR / Docker Hub

services:
  # Clutch blockchain nodes
  node1:
    image: ghcr.io/clutchprotocol/clutch-node:latest
    stop_grace_period: 30s
    # DB_PATH keeps RocksDB on the volume below. Without it the node writes to its working
    # directory — the container's WRITABLE LAYER — and `up -d --force-recreate`, which every
    # deploy runs, discarded the whole chain. Stage restarted from genesis on every deploy.
    environment:
      - DB_PATH=/app/data
    networks:
      - clutch-network
    ports:
      - "8081:8081"
      - "4001:4001"
      - "3001:3001"
    volumes:
      - ./config:/app/config:ro
      # One volume per node: each has its own blockchain_name/DB and they must not share state.
      - node1-data:/app/data
    command: ["--env", "node1"]
    restart: unless-stopped

  node2:
    image: ghcr.io/clutchprotocol/clutch-node:latest
    stop_grace_period: 30s
    # DB_PATH keeps RocksDB on the volume below. Without it the node writes to its working
    # directory — the container's WRITABLE LAYER — and `up -d --force-recreate`, which every
    # deploy runs, discarded the whole chain. Stage restarted from genesis on every deploy.
    environment:
      - DB_PATH=/app/data
    depends_on:
      - node1
    networks:
      - clutch-network
    ports:
      - "8082:8082"
      - "4002:4002"
      - "3002:3002"
    volumes:
      - ./config:/app/config:ro
      # One volume per node: each has its own blockchain_name/DB and they must not share state.
      - node2-data:/app/data
    command: ["--env", "node2"]
    restart: unless-stopped

  node3:
    image: ghcr.io/clutchprotocol/clutch-node:latest
    stop_grace_period: 30s
    # DB_PATH keeps RocksDB on the volume below. Without it the node writes to its working
    # directory — the container's WRITABLE LAYER — and `up -d --force-recreate`, which every
    # deploy runs, discarded the whole chain. Stage restarted from genesis on every deploy.
    environment:
      - DB_PATH=/app/data
    depends_on:
      - node1
    networks:
      - clutch-network
    ports:
      - "8083:8083"
      - "4003:4003"
      - "3003:3003"
    volumes:
      - ./config:/app/config:ro
      # One volume per node: each has its own blockchain_name/DB and they must not share state.
      - node3-data:/app/data
    command: ["--env", "node3"]
    restart: unless-stopped

  # Clutch Hub API (bridges apps to node)
  clutch-hub-api:
    image: ghcr.io/clutchprotocol/clutch-hub-api:latest
    depends_on:
      - node1
      - seq
    ports:
      - "3000:3000"
    environment:
      - RUST_LOG=info
      # Pointed at node3. node1 is the p2p bootstrap and fell ~115,000 blocks behind; node2 then
      # turned out to be stuck near height 100 as well. Both answer get_chain_info cheerfully with
      # a stale height, so every service reading them saw a chain frozen near genesis while the
      # real one was past 117,000. node3 is the only node currently holding the full chain.
      # Being the bootstrap is a p2p role and says nothing about which node is best to read.
      - CLUTCH_NODE_WS_URL=ws://node3:8083/ws
      - SEQ_URL=http://seq:80
      - SEQ_API_KEY=${SEQ_API_KEY:-}
      - APP_ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
      - "APP_JWT_SECRET=${JWT_SECRET:?not set - it signs the tokens the hub API issues and the orchestrator trusts, so there is no safe default. Run provision-treasury-secrets.yml}"
      # Faucet key is env-only — config/api/default.toml is committed, so a key written there is
      # a published key. Empty leaves the faucet disabled rather than running on a known secret.
      - APP_FAUCET_PRIVATE_KEY=${FAUCET_PRIVATE_KEY:-}
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - clutch-network
    volumes:
      - ./config/api:/app/config:ro

  # Prometheus - metrics collection
  prometheus:
    image: prom/prometheus
    networks:
      - clutch-network
    ports:
      - "9090:9090"
    volumes:
      - prometheus-data:/prometheus
      - ./config/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--storage.tsdb.retention.time=200h"
      - "--web.enable-lifecycle"
    restart: unless-stopped

  # Grafana - dashboards 
  grafana:
    image: grafana/grafana
    depends_on:
      - prometheus
    networks:
      - clutch-network
    ports:
      - "3030:3030"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/monitoring/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./config/monitoring/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./config/monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards/clutch:ro
    environment:
      - GF_SERVER_HTTP_PORT=3030
      # Was hardcoded 'admin'. Committed value is a fallback only — override with
      # GRAFANA_ADMIN_PASSWORD in .env per environment. Grafana re-applies this to the
      # admin user on every restart, so a redeploy rotates it.
      - "GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?not set. Run provision-treasury-secrets.yml}"
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    restart: unless-stopped

  # Seq - structured logging
  seq:
    image: datalust/seq
    networks:
      - clutch-network
    ports:
      - "5341:80"
    volumes:
      - seq-data:/data
    environment:
      - ACCEPT_EULA=Y
      # Enable authentication on first run (requires empty/new /data volume)
      - SEQ_FIRSTRUN_ADMINUSERNAME=${SEQ_ADMIN_USERNAME:-admin}
      - SEQ_FIRSTRUN_ADMINPASSWORD=${SEQ_ADMIN_PASSWORD:-}
    restart: unless-stopped

  # Demo app (React + map-based ride request)
  clutch-hub-demo-app:
    image: ghcr.io/clutchprotocol/clutch-hub-demo-app:latest
    ports:
      - "5173:80"
    depends_on:
      - clutch-hub-api
    networks:
      - clutch-network
    restart: unless-stopped

  clutch-explorer-backend:
    image: ghcr.io/clutchprotocol/clutch-explorer-backend:latest
    stop_grace_period: 30s
    depends_on:
      - node1
      - seq
      - clutch-explorer-postgres
      - clutch-explorer-indexer
    ports:
      - "8088:8088"
    environment:
      - APP_LOG_LEVEL=info
      - APP_DATA_SOURCE=postgres
      - APP_DATABASE_URL=postgres://${EXPLORER_POSTGRES_USER:-postgres}:${EXPLORER_POSTGRES_PASSWORD:-postgres}@clutch-explorer-postgres:5432/${EXPLORER_POSTGRES_DB:-clutch_explorer}
      # Pointed at node3. node1 is the p2p bootstrap and fell ~115,000 blocks behind; node2 then
      # turned out to be stuck near height 100 as well. Both answer get_chain_info cheerfully with
      # a stale height, so every service reading them saw a chain frozen near genesis while the
      # real one was past 117,000. node3 is the only node currently holding the full chain.
      # Being the bootstrap is a p2p role and says nothing about which node is best to read.
      - APP_CLUTCH_NODE_API_URL=http://node3:8083
      - APP_STRICT_MODE=true
      - APP_DEVELOPER_MODE=${EXPLORER_DEVELOPER_MODE:-false}
      - APP_CLEANUP_ON_START=${EXPLORER_CLEANUP_ON_START:-false}
      - APP_SEQ_URL=http://seq:80
      - APP_SEQ_API_KEY=${SEQ_API_KEY:-}
      - APP_ALLOWED_ORIGINS=${EXPLORER_ALLOWED_ORIGINS:-*}
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8088/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - clutch-network
    volumes:
      - ./config/explorer:/app/config:ro

  clutch-explorer-indexer:
    image: ghcr.io/clutchprotocol/clutch-explorer-backend:latest
    stop_grace_period: 30s
    depends_on:
      - node1
      - seq
      - clutch-explorer-postgres
    command: ["/usr/local/bin/indexer", "--env", "default"]
    environment:
      - APP_LOG_LEVEL=info
      - APP_DATA_SOURCE=postgres
      - APP_DATABASE_URL=postgres://${EXPLORER_POSTGRES_USER:-postgres}:${EXPLORER_POSTGRES_PASSWORD:-postgres}@clutch-explorer-postgres:5432/${EXPLORER_POSTGRES_DB:-clutch_explorer}
      - APP_NODE_METRICS_URL=http://node1:3001/metrics
      # Pointed at node3. node1 is the p2p bootstrap and fell ~115,000 blocks behind; node2 then
      # turned out to be stuck near height 100 as well. Both answer get_chain_info cheerfully with
      # a stale height, so every service reading them saw a chain frozen near genesis while the
      # real one was past 117,000. node3 is the only node currently holding the full chain.
      # Being the bootstrap is a p2p role and says nothing about which node is best to read.
      - APP_NODE_WS_URL=ws://node3:8083/ws
      - APP_DEVELOPER_MODE=${EXPLORER_DEVELOPER_MODE:-false}
      - APP_CLEANUP_ON_START=${EXPLORER_CLEANUP_ON_START:-false}
      - APP_INDEXER_POLL_INTERVAL_MS=4000
      - APP_INDEXER_START_HEIGHT=0
      - APP_SEQ_URL=http://seq:80
      - APP_SEQ_API_KEY=${SEQ_API_KEY:-}
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - clutch-network
    volumes:
      - ./config/explorer:/app/config:ro

  clutch-explorer-postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=${EXPLORER_POSTGRES_DB:-clutch_explorer}
      - POSTGRES_USER=${EXPLORER_POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${EXPLORER_POSTGRES_PASSWORD:-postgres}
    volumes:
      - clutch-explorer-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${EXPLORER_POSTGRES_USER:-postgres} -d ${EXPLORER_POSTGRES_DB:-clutch_explorer}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - clutch-network

  clutch-explorer-frontend:
    image: ghcr.io/clutchprotocol/clutch-explorer-frontend:latest
    ports:
      - "5174:80"
    depends_on:
      - clutch-explorer-backend
    networks:
      - clutch-network
    restart: unless-stopped

networks:
  clutch-network:
    driver: bridge

volumes:
  # Chain state. `down -v` wipes these, which is what clutch-deploy's reset_chain flag is for —
  # and now actually means something, since a plain deploy no longer resets the chain.
  node1-data:
    driver: local
  node2-data:
    driver: local
  node3-data:
    driver: local
  seq-data:
    driver: local
  grafana-data:
    driver: local
  prometheus-data:
    driver: local
  clutch-explorer-postgres-data:
    driver: local
