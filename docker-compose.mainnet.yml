# Clutch MAINNET validators.
#
# A SEPARATE compose project with its OWN network, deliberately -- not an overlay on the base file.
# The testnet nodes discover peers over mDNS (their logs say so), and on a shared Docker network the
# mainnet nodes would find them and try to peer. The handshake compares the genesis hash so it would
# fail, but that turns a clean separation into a permanent stream of failed handshakes between two
# chains that should not know each other exists.
#
#   docker compose -p clutch-main -f docker-compose.mainnet.yml up -d
#
# NOTHING IS PUBLISHED. All three validators talk over this network by service name, so no port
# needs to reach the host. The testnet base file publishes 8081-8083 for local development; doing
# the same here would put a mainnet RPC on the VPS's public interface, which is exactly what
# docker-compose.stage.cloudflare-flex.yml exists to undo for the testnet. When something outside
# needs to reach these nodes, join it to this network rather than publishing a port.
#
# Internal ports are 8181-8183 / 4101-4103 / 3101-3103 rather than the testnet's. On separate
# networks they could have been identical, but distinct numbers mean a log line, a config file or a
# future published port is never ambiguous about which chain it belongs to.
#
# Before the first boot:
#   CONFIG_DIR=config/node-mainnet MAINNET=1 bash scripts/check-genesis.sh

services:
  mainnet-node1:
    image: ghcr.io/clutchprotocol/clutch-node:sha-c3e301f
    stop_grace_period: 30s
    environment:
      # The node reads Environment::with_prefix("APP"), so this overrides the empty
      # author_secret_key in the committed config. The value lives only in the host's .env,
      # generated there by mainnet-validator-keys.yml and never committed.
      - APP_AUTHOR_SECRET_KEY=${MAINNET_NODE1_AUTHOR_SECRET:?the mainnet validator keys are not in .env — run the "Mainnet — generate validator keys" workflow}
      - APP_SEQ_API_KEY=${SEQ_API_KEY:-}
      # Keeps RocksDB on the volume below. Without it the node writes to the container's writable
      # layer and every `up -d --force-recreate` discards the chain.
      - DB_PATH=/app/data
    networks:
      - clutch-mainnet
    volumes:
      # Mounted at config/node, not config: the node builds its path as `config/node/{env}.toml`
      # in code, so the mainnet directory is selected here rather than with --env.
      - ./config/node-mainnet:/app/config/node:ro
      - mainnet-node1-data:/app/data
    command: ["--env", "node1"]
    restart: unless-stopped

  mainnet-node2:
    image: ghcr.io/clutchprotocol/clutch-node:sha-c3e301f
    stop_grace_period: 30s
    environment:
      - APP_AUTHOR_SECRET_KEY=${MAINNET_NODE2_AUTHOR_SECRET:?the mainnet validator keys are not in .env — run the "Mainnet — generate validator keys" workflow}
      - APP_SEQ_API_KEY=${SEQ_API_KEY:-}
      - DB_PATH=/app/data
    networks:
      - clutch-mainnet
    volumes:
      - ./config/node-mainnet:/app/config/node:ro
      - mainnet-node2-data:/app/data
    command: ["--env", "node2"]
    depends_on:
      - mainnet-node1
    restart: unless-stopped

  mainnet-node3:
    image: ghcr.io/clutchprotocol/clutch-node:sha-c3e301f
    stop_grace_period: 30s
    environment:
      - APP_AUTHOR_SECRET_KEY=${MAINNET_NODE3_AUTHOR_SECRET:?the mainnet validator keys are not in .env — run the "Mainnet — generate validator keys" workflow}
      - APP_SEQ_API_KEY=${SEQ_API_KEY:-}
      - DB_PATH=/app/data
    networks:
      - clutch-mainnet
    volumes:
      - ./config/node-mainnet:/app/config/node:ro
      - mainnet-node3-data:/app/data
    command: ["--env", "node3"]
    depends_on:
      - mainnet-node1
    restart: unless-stopped

  # ---------------------------------------------------------------------------------------
  # The app side. These are NOT validators: they carry no keys and author nothing, so losing
  # one is an outage rather than a loss of the chain.

  mainnet-hub-api:
    image: ghcr.io/clutchprotocol/clutch-hub-api:sha-21a26a3
    environment:
      - RUST_LOG=info
      # node3 deliberately, matching the testnet: being the p2p bootstrap is a different job
      # from being the best node to read, and node1 there fell ~115,000 blocks behind while
      # answering queries cheerfully.
      - CLUTCH_NODE_WS_URL=ws://mainnet-node3:8183/ws
      - SEQ_URL=http://seq:80
      - APP_SEQ_API_KEY=${SEQ_API_KEY:-}
      - APP_ALLOWED_ORIGINS=${MAINNET_ALLOWED_ORIGINS:-https://app.clutchprotocol.io}
      # A DIFFERENT secret from the testnet's, required rather than defaulted. Sharing one
      # would make a token minted against the testnet hub valid on the mainnet hub, which is
      # the whole reason the chains got different chain_ids.
      - "APP_JWT_SECRET=${MAINNET_JWT_SECRET:?set MAINNET_JWT_SECRET in .env -- it must NOT be the same value as JWT_SECRET}"
    networks:
      # Both, and this service is the only thing that bridges them. clutch-mainnet to reach
      # the validators; the stage network because nginx lives over there and resolves
      # upstreams by container name. The validators stay on one network only.
      - clutch-mainnet
      - clutch-stage
    volumes:
      - ./config/api-mainnet:/app/config:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      - mainnet-node3
    restart: unless-stopped

  mainnet-demo-app:
    # The SAME image the testnet serves. It picks its chain and its API from the hostname it
    # is served on (apps/demo/src/chain-for-host.js), so app.clutchprotocol.io gets chain 1000
    # and api.clutchprotocol.io with nothing baked in at build time.
    image: ghcr.io/clutchprotocol/clutch-hub-demo-app:sha-9b27014
    networks:
      - clutch-stage
    restart: unless-stopped

networks:
  clutch-mainnet:
    name: clutch-mainnet
  # nginx resolves upstreams by container name and lives in the v2ray project, joined to the
  # testnet stack's network. The mainnet app services join it so nginx can reach them; the
  # validators never do.
  clutch-stage:
    name: clutch-stage_clutch-network
    external: true

volumes:
  # One per node: each has its own blockchain_name and database and they must not share state.
  # `down -v` wipes these. On a mainnet chain that is not a reset, it is the loss of the chain.
  mainnet-node1-data:
    driver: local
  mainnet-node2-data:
    driver: local
  mainnet-node3-data:
    driver: local
