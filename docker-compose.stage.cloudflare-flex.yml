# Stage / VPS: app stack only (no nginx). Run nginx separately — see docker-compose.stage.nginx.yml.
# P2P ports (4001-4003) remain internal.
#
# docker compose -p clutch-stage -f docker-compose.yml -f docker-compose.stage.cloudflare-flex.yml up -d
services:
  # The stage validators run on keys that are NOT in git. config/node, which the base file mounts, is
  # the local dev set and its secrets are public (that is how the first three stage keys were lost), so
  # stage mounts config/node-stage over it: addresses only. Each secret comes from .env.testnet as
  # APP_AUTHOR_SECRET_KEY, and `:?` stops any compose command on this stack, before it touches a
  # container, while the keys are not there yet: a node must never start with an empty secret.
  # "Stage — generate validator keys (once)" writes them. Every stage command passes this file
  # (deploy-stage.sh, chain.sh, restart-validator.sh, upgrade-validators.sh). Stage started from the
  # base file alone would run the public dev keys again and say nothing, so it never is.
  # config/node must stay in the repo: it is the mount point of the nested mount below, and Docker
  # cannot create a missing one inside the read-only /app/config.
  node1:
    ports: !reset []
    environment:
      - APP_AUTHOR_SECRET_KEY=${TESTNET_NODE1_AUTHOR_SECRET:?the stage validator keys are not in .env.testnet — run the "Stage — generate validator keys" workflow}
    volumes:
      - ./config/node-stage:/app/config/node:ro

  node2:
    ports: !reset []
    environment:
      - APP_AUTHOR_SECRET_KEY=${TESTNET_NODE2_AUTHOR_SECRET:?the stage validator keys are not in .env.testnet — run the "Stage — generate validator keys" workflow}
    volumes:
      - ./config/node-stage:/app/config/node:ro

  node3:
    ports: !reset []
    environment:
      - APP_AUTHOR_SECRET_KEY=${TESTNET_NODE3_AUTHOR_SECRET:?the stage validator keys are not in .env.testnet — run the "Stage — generate validator keys" workflow}
    volumes:
      - ./config/node-stage:/app/config/node:ro

  clutch-hub-api:
    ports: !reset []

  prometheus:
    ports: !reset []
    # Joined to the MAINNET network as well, read-only, so it can scrape mainnet-node1..3 on
    # 3101-3103. That compose project publishes nothing to the host by design, so this join is
    # the only path to those metrics. Prometheus runs no libp2p, so the mainnet nodes gain no
    # peer from it; the separation that matters -- testnet NODES never seeing mainnet NODES --
    # is untouched.
    #
    # `external: true` couples this stack to the mainnet network EXISTING. If `up` fails with
    # "network clutch-mainnet declared as external, but could not be found", the mainnet
    # project has been taken down -- which is the emergency, not this error. Chosen over a
    # `docker network connect` in the deploy script precisely so it fails loudly: this repo
    # has been burned more than once by monitoring that silently loaded nothing.
    networks:
      - clutch-network
      - clutch-mainnet

  # Alertmanager's UI takes no authentication and can create silences, so a published 9093 is
  # a public mute button on every alert this stack raises.
  alertmanager:
    ports: !reset []

  grafana:
    ports: !reset []
    environment:
      - GF_SERVER_DOMAIN=grafana-stage.clutchprotocol.io
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s/
      - GF_SERVER_SERVE_FROM_SUB_PATH=false

  seq:
    ports: !reset []

  # No `image:` on these, on purpose. The pinned tags live in docker-compose.yml, and an image set
  # here would silently win the merge and undo the pin. scripts/test-set-image.sh refuses a PR
  # that adds one back.
  clutch-hub-demo-app:
    ports: !reset []

  clutch-explorer-backend:
    ports: !reset []

  clutch-explorer-frontend:
    ports: !reset []

  clutch-explorer-indexer:
    ports: !reset []

  clutch-explorer-postgres:
    ports: !reset []
    image: postgres:16-alpine

networks:
  # Created by docker-compose.mainnet.yml (project clutch-main). See prometheus above.
  clutch-mainnet:
    external: true
