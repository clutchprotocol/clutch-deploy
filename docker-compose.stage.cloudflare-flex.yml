# Stage / VPS: app stack only (no nginx). Run nginx separately — see docker-compose.stage.nginx.yml.
# P2P ports (4001-4003) remain internal.
#
# docker compose -p clutch-stage -f docker-compose.yml -f docker-compose.stage.cloudflare-flex.yml up -d
services:
  node1:
    ports: !reset []

  node2:
    ports: !reset []

  node3:
    ports: !reset []

  clutch-hub-api:
    ports: !reset []

  prometheus:
    ports: !reset []

  grafana:
    ports: !reset []
    environment:
      - GF_SERVER_DOMAIN=grafana-stage.clutchprotocol.io
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s/
      - GF_SERVER_SERVE_FROM_SUB_PATH=false

  seq:
    ports: !reset []

  # Pre-built image (see clutch-hub-demo-app CI). `docker compose pull` updates stage without --build.
  clutch-hub-demo-app:
    ports: !reset []
    image: ghcr.io/clutchprotocol/clutch-hub-demo-app:latest

  clutch-explorer-backend:
    ports: !reset []
    image: ghcr.io/clutchprotocol/clutch-explorer-backend:latest
    environment:
      - APP_DEVELOPER_MODE=true
      - APP_CLEANUP_ON_START=true

  clutch-explorer-frontend:
    ports: !reset []
    image: ghcr.io/clutchprotocol/clutch-explorer-frontend:latest

  clutch-explorer-indexer:
    ports: !reset []
    image: ghcr.io/clutchprotocol/clutch-explorer-backend:latest
    environment:
      - APP_DEVELOPER_MODE=true
      - APP_CLEANUP_ON_START=true

  clutch-explorer-postgres:
    ports: !reset []
    image: postgres:16-alpine
