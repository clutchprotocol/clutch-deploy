# Stage port reset for the treasury overlay. SEPARATE from
# docker-compose.stage.cloudflare-flex.yml on purpose: a service key that carries only
# `ports: !reset []` still DECLARES that service, so putting this in the main stage overlay makes a
# core-only deploy fail with "has neither an image nor a build context".
#
# Include this ONLY alongside docker-compose.treasury.yml, and keep it LAST in the -f order —
# compose merges port lists, so the reset must be applied after the file that publishes the port.
#
# This file briefly got deleted along with the Bitcart overlays it also served. That would have
# PUBLISHED the orchestrator on the VPS's public interface: 8091 is the deposit API, and stage
# reaches it same-origin through nginx's /payment/ route, so it has no business being directly
# reachable. Keep the file even though it now resets exactly one port.
services:
  payment-orchestrator:
    ports: !reset []
