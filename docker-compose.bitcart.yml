# Bitcart 0.10.3.0 — the payment processor, pinned.
#
# Pinned deliberately and not tracked to `latest`: Bitcart is effectively a single-maintainer
# project, so an unreviewed upgrade can change the invoice API shape underneath the adapter. Five
# field-name assumptions in our adapter turned out to be wrong when first checked against this
# version's source; treat any version bump as an adapter review, not a pull.
#
# TRX ONLY (spec §6). No BTC, no XMR, no Lightning. Every extra coin daemon is another key-holding
# process and another way to accept money we have no reserve process for.
#
# WATCH-ONLY custody. The wallet configured in the Bitcart store is the custody Tron ADDRESS with
# no private key, so this box can generate invoices and observe payments but can never spend. That
# property is what makes it acceptable to co-host the processor with the rest of the stack.
#
# Compose alongside the treasury overlay:
#   docker compose -p clutch-dev -f docker-compose.yml -f docker-compose.dev.yml \
#                                -f docker-compose.treasury.yml -f docker-compose.bitcart.yml up -d
services:
  bitcart-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bitcart
      POSTGRES_USER: bitcart
      POSTGRES_PASSWORD: ${BITCART_POSTGRES_PASSWORD:-bitcart-local-dev}
    volumes:
      - bitcart-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bitcart"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - clutch-network

  bitcart-redis:
    image: redis:7-alpine
    volumes:
      - bitcart-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - clutch-network

  # The TRX daemon. Talks to Tron through TronGrid rather than a local node — that is a documented
  # deviation from spec §7.1 (own lite node) and is listed as a launch follow-up.
  bitcart-trx:
    image: bitcart/bitcart-trx:0.10.3.0
    environment:
      # The daemon has no usable default Tron RPC and dies with a bare ConnectError without this.
      # Env prefix is the coin name: TRX_<SETTING> (daemons/base.py load_env).
      TRX_SERVER: ${TRONGRID_URL:-https://nile.trongrid.io}
      TRX_NETWORK: ${TRX_NETWORK:-nile}
      TRX_TRONGRID_API_KEY: ${TRONGRID_API_KEY:-}
      # Verbose while deposit detection is unproven. The daemon is otherwise almost silent: a
      # confirmed on-chain transfer, to a loaded wallet, on a daemon synced to Nile's head, went
      # undetected and the log said nothing at all — leaving only inference from the image's
      # source. `daemons/base.py` reads this as VERBOSE via env("DEBUG"), i.e. TRX_DEBUG.
      # Flip to false (BITCART_TRX_DEBUG=false in .env) once the deposit path is proven.
      TRX_DEBUG: ${BITCART_TRX_DEBUG:-true}
      REDIS_HOST: bitcart-redis
    depends_on:
      bitcart-redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - clutch-network

  bitcart-backend:
    image: bitcart/bitcart:0.10.3.0
    # The image's CMD is a bare `sh`, so without this it starts a shell and never serves. Taken
    # from the image's own justfile `prod-api-up` target: migrate, then gunicorn.
    command: ["sh", "-c", "alembic upgrade head && gunicorn -c gunicorn.conf.py main:app"]
    environment:
      BITCART_INSTALL: backend
      BITCART_REVERSEPROXY: none
      # trx and nothing else — see header.
      # The backend builds each daemon URL as http://{COIN}_HOST:{COIN}_PORT, defaulting to
      # localhost (api/services/coins.py) — so without TRX_HOST it never reaches the daemon and
      # every wallet validation fails with a misleading "Wallet key invalid".
      TRX_HOST: bitcart-trx
      TRX_PORT: "5009"
      # Must match the daemon side, which defaults to electrum/electrumz (daemons/base.py).
      TRX_LOGIN: ${BITCART_DAEMON_LOGIN:-electrum}
      TRX_PASSWORD: ${BITCART_DAEMON_PASSWORD:-electrumz}
      BITCART_CRYPTOS: trx
      BITCART_HOST: ${BITCART_HOST:-localhost}
      DB_HOST: bitcart-postgres
      DB_DATABASE: bitcart
      DB_USER: bitcart
      DB_PASSWORD: ${BITCART_POSTGRES_PASSWORD:-bitcart-local-dev}
      REDIS_HOST: bitcart-redis
      # /app is root-owned and the container runs as electrum(1000); the default DATADIR of
      # "data" resolves under /app and fails to create. Point it at a writable volume instead.
      # /app is root-owned and the container runs as electrum(1000), so the default DATADIR
      # ("data", resolved under /app) cannot be created. A named volume would also be root-owned.
      # /tmp is writable by any user; nothing durable lives here — stores, invoices, wallets and
      # tokens are all in Postgres. This holds only images/files/logs/plugins.
      BITCART_DATADIR: /tmp/bitcart-data
      # These four default to "data/..." independently of DATADIR, so each must be redirected
      # too — setting DATADIR alone still tries to create /app/data and dies.
      BITCART_BACKUPS_DIR: /tmp/bitcart-data/backups
      BITCART_ADMIN_PLUGINS_DIR: /tmp/bitcart-data/admin_plugins
      BITCART_STORE_PLUGINS_DIR: /tmp/bitcart-data/store_plugins
      BITCART_DOCKER_PLUGINS_DIR: /tmp/bitcart-data/docker_plugins
      TRX_NETWORK: ${TRX_NETWORK:-nile}
    depends_on:
      bitcart-postgres:
        condition: service_healthy
      bitcart-redis:
        condition: service_healthy
    ports:
      # Published for local admin/API work only. Behind nginx in stage; never expose the admin
      # surface publicly without auth in front of it.
      - "8092:8000"
    restart: unless-stopped
    networks:
      - clutch-network

  bitcart-worker:
    image: bitcart/bitcart:0.10.3.0
    command: ["python3", "worker.py"]
    environment:
      # /app is root-owned and the container runs as electrum(1000), so the default DATADIR
      # ("data", resolved under /app) cannot be created. A named volume would also be root-owned.
      # /tmp is writable by any user; nothing durable lives here — stores, invoices, wallets and
      # tokens are all in Postgres. This holds only images/files/logs/plugins.
      BITCART_DATADIR: /tmp/bitcart-data
      # These four default to "data/..." independently of DATADIR, so each must be redirected
      # too — setting DATADIR alone still tries to create /app/data and dies.
      BITCART_BACKUPS_DIR: /tmp/bitcart-data/backups
      BITCART_ADMIN_PLUGINS_DIR: /tmp/bitcart-data/admin_plugins
      BITCART_STORE_PLUGINS_DIR: /tmp/bitcart-data/store_plugins
      BITCART_DOCKER_PLUGINS_DIR: /tmp/bitcart-data/docker_plugins
      BITCART_INSTALL: worker
      BITCART_CRYPTOS: trx
      DB_HOST: bitcart-postgres
      DB_DATABASE: bitcart
      DB_USER: bitcart
      DB_PASSWORD: ${BITCART_POSTGRES_PASSWORD:-bitcart-local-dev}
      # A bare hostname, NOT a URL: settings builds "redis://{HOST}:{PORT}/{DB}" itself, so a
      # "redis://" prefix here yields "redis://redis://bitcart-redis" and resolves host "redis".
      REDIS_HOST: bitcart-redis
      TRX_NETWORK: ${TRX_NETWORK:-nile}
    depends_on:
      bitcart-backend:
        condition: service_started
    restart: unless-stopped
    networks:
      - clutch-network

volumes:
  bitcart-postgres-data:
    driver: local
  bitcart-redis-data:
    driver: local
